<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本棚｜YUME WORLD</title><style>*{box-sizing:border-box}body{margin:0;color:#625665;font-family:"Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff7fb,#f2f1ff)}.page{max-width:980px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:22px;padding:10px 16px;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:#fff;text-decoration:none;cursor:pointer;font:inherit}.btn.light{background:#eee5f4;color:#876c90}.tabs{display:flex;gap:10px;margin:18px 0;overflow:auto}.tabs .btn{white-space:nowrap}.tabs .active{background:linear-gradient(135deg,#ee8fb0,#d878ad)}.shelf{background:#fffafdf2;border-radius:24px;padding:22px;box-shadow:0 8px 28px #ae86ae1c}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.book{display:flex;gap:13px;padding:13px;border-radius:17px;background:#fff;border:1px solid #ead9e3;cursor:pointer}.book:hover{transform:translateY(-2px);box-shadow:0 5px 15px #c997b533}.cover{width:84px;height:115px;flex:none;border-radius:10px;background:linear-gradient(135deg,#d99bc0,#bca9e8);display:grid;place-items:center;color:#fff;font-weight:bold;text-align:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.book h3{margin:3px 0;color:#a56f93}.book p{margin:5px 0;font-size:.86rem;line-height:1.45}.meta{color:#968497}.empty{text-align:center;padding:35px;color:#a58b9d}@media(max-width:600px){.page{padding:10px}.books{grid-template-columns:1fr}.top h1{font-size:22px}}</style></head><body><main class="page"><div class="top"><h1>📚 本棚</h1><a class="btn light" href="index.html">🏠 ホーム</a></div><div class="tabs"><button id="recentTab" class="btn active">📖 最近読んだ</button><button id="favoriteTab" class="btn light">💗 お気に入り</button><a class="btn light" href="mypage.html">👤 マイページ</a></div><section class="shelf"><h2 id="heading">最近読んだ小説</h2><div id="books" class="books"></div></section></main><script>const $=id=>document.getElementById(id),ACTIVE='yumeWorldActiveAccount',ACCOUNT='yumeWorldAccountsV1',BASE='yumeWorldNovelV3',viewer=localStorage.getItem(ACTIVE)||'guest';let mode='recent';function esc(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}function accounts(){try{return JSON.parse(localStorage.getItem(ACCOUNT)||'[]')}catch(e){return[]}}function name(id){return accounts().find(a=>a.id===id)?.name||'ゲスト'}function shelf(){try{return JSON.parse(localStorage.getItem('yumeWorldBookshelfV1:'+viewer)||'{"recent":{},"favorites":{}}')}catch(e){return{recent:{},favorites:{}}}}function novel(owner){try{return JSON.parse(localStorage.getItem(owner==='guest'?BASE:BASE+':'+owner)||'null')}catch(e){return null}}function render(){const s=shelf(),items=Object.values(s[mode]||{}).sort((a,b)=>b.lastRead-a.lastRead);$('heading').textContent=mode==='recent'?'最近読んだ小説':'お気に入りの小説';$('books').innerHTML='';if(!items.length){$('books').innerHTML='<div class="empty">'+(mode==='recent'?'まだ読んだ小説はありません。':'お気に入りの小説はありません。')+'</div>';return}items.forEach(x=>{const n=novel(x.owner);const title=n?.title||x.title||'削除された作品';const cover=n?.cover||x.cover;const genre=n?.novelInfo?.genre||x.genre||'その他';const copy=n?.novelInfo?.catchCopy||x.catchCopy||'';const fav=n?.readStats?.favorites?Object.keys(n.readStats.favorites).length:0;const views=n?.readStats?.views||0;const el=document.createElement('article');el.className='book';el.innerHTML='<div class="cover">'+(cover?'<img src="'+cover+'">':'YUME<br>WORLD')+'</div><div><h3>'+esc(title)+'</h3><p class="meta">作者：'+esc(name(x.owner))+'</p><p>'+esc(genre)+'</p><p>'+esc(copy)+'</p><p class="meta">👁 '+views+'　♡ '+fav+'</p><p class="meta">最終閲覧：'+new Date(x.lastRead).toLocaleString('ja-JP')+'</p></div>';el.onclick=()=>location.href='reader.html?account='+encodeURIComponent(x.owner);$('books').append(el)})}$('recentTab').onclick=()=>{mode='recent';$('recentTab').classList.add('active');$('favoriteTab').classList.remove('active');render()};$('favoriteTab').onclick=()=>{mode='favorites';$('favoriteTab').classList.add('active');$('recentTab').classList.remove('active');render()};render();</script></body></html>
