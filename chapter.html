<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チャプター編集｜YUME WORLD</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fc;color:#625665;font-family:"Yu Gothic",sans-serif;min-height:100vh}.top{height:66px;position:sticky;top:0;z-index:4;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(135deg,#f7c9df,#dcd0ff);color:#fff;box-shadow:0 3px 15px #8e6a8a22}.top-left,.top-right{display:flex;gap:7px;align-items:center}.top-right{justify-content:flex-end}.top a,.top button{border:0;border-radius:18px;padding:8px 11px;background:#ffffff55;color:#fff;text-decoration:none;cursor:pointer;font:inherit;font-size:.86rem}.top input{width:100%;border:0;border-radius:18px;padding:10px 15px;text-align:center;background:#ffffffdd;color:#765f72;font:inherit;outline:0}.count{font-size:.75rem;text-align:center;white-space:nowrap}.page{max-width:900px;margin:auto;padding:20px 14px 180px}.paper{position:relative;min-height:470px;padding:26px 22px;border-radius:22px;background:#fff;box-shadow:0 8px 27px #bd93b519;overflow:hidden}.paper:before{content:"";position:absolute;inset:0;background-image:var(--chapter-bg);background-size:cover;background-position:center;opacity:var(--bg-opacity,.16);filter:var(--bg-filter,none);z-index:0}.paper>*{position:relative;z-index:1}.empty{text-align:center;color:#aa96a7;padding:80px 10px}.block{position:relative;margin:14px 0;padding:11px 12px;border:1px solid transparent;border-radius:15px}.block:hover{border-color:#efdce8;background:#fffafd}.block-tools{display:none;position:absolute;right:5px;top:3px;gap:4px}.block:hover .block-tools{display:flex}.block-tools button{border:0;border-radius:12px;padding:4px 7px;background:#eee4f5;color:#85678d;cursor:pointer}.text{font-size:1.05rem;line-height:2;white-space:pre-wrap}.message{font-size:.82rem;color:#a08a9d;line-height:1.7;white-space:pre-wrap}.bubble-row{display:flex;gap:10px;align-items:flex-start}.bubble-row.right{flex-direction:row-reverse}.bubble-icon{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden;background:#eadcf7;display:grid;place-items:center}.bubble-icon img{width:100%;height:100%;object-fit:cover}.bubble{display:block;flex:0 1 auto;width:max-content;min-width:80px;max-width:min(78vw,680px);padding:12px 16px;background:#f8d8e8;word-break:normal;overflow-wrap:anywhere;white-space:pre-wrap;writing-mode:horizontal-tb;word-spacing:normal}.bubble.message-bubble{font-size:.86rem;line-height:1.65;padding:10px 14px}.bubble-name{font-weight:700;color:#625665;font-size:.9rem;margin:0 8px 5px}.bubble-row.right .bubble-name{text-align:right}.bubble.message-bubble{font-size:.86rem;line-height:1.65;padding:10px 14px}.bubble-name{font-weight:700;color:#625665;font-size:.9rem;margin:0 8px 5px}.bubble-row.right .bubble-name{text-align:right}.bubble.standard{border-radius:20px}.bubble.round{border-radius:50px}.bubble.square{border-radius:4px}.bubble.heart{border-radius:45% 45% 45% 10%}.bubble.cloud{border-radius:40px}.bubble.ribbon{border-left:10px solid #fff8}.bubble.crystal{transform:skew(-2deg)}.bubble.drop{border-radius:50% 50% 50% 8%}.bubble.pattern-dots{background-image:radial-gradient(#ffffff99 1.5px,transparent 1.5px);background-size:9px 9px}.bubble.pattern-stripes{background-image:repeating-linear-gradient(45deg,#ffffff44 0 5px,transparent 5px 10px)}.bubble.pattern-check{background-image:linear-gradient(#ffffff33 1px,transparent 1px),linear-gradient(90deg,#ffffff33 1px,transparent 1px);background-size:10px 10px}.bubble.pattern-heart:after{content:'♥';float:right;color:#fff9}.bubble.pattern-star:after{content:'✦';float:right;color:#fff9}.bubble.pattern-sparkle:after{content:'✧ ✦';float:right;color:#fff9}.small-read{font-size:.68rem;color:#a68b9e;margin:4px 8px}.art{text-align:center}.art.media-left{text-align:left}.art.media-right{text-align:right}.art img{max-width:100%;max-height:420px;border-radius:13px;object-fit:contain}.art.stamp img{max-width:120px;max-height:120px}.poll,.novel-link,.call,.deco{padding:16px;border-radius:17px;background:#fdf1f8;border:1px solid #efd8e7}.poll h3,.novel-link h3{margin:0 0 10px;color:#a26c91}.poll label{display:block;margin:7px 0}.poll input{accent-color:#d99bc0}.novel-link a{color:#9c6b91;font-weight:bold}.call{text-align:center;background:#f0edff}.call strong{display:block;color:#8171ad}.deco{text-align:center;font-size:1.45rem;color:#b787a6;background:transparent;border:0}.editor{margin-top:18px}.editor details{background:#fff;border-radius:16px;margin:8px 0;padding:12px;box-shadow:0 3px 12px #be93b512}.editor summary{cursor:pointer;color:#a26c91;font-weight:bold}.editor textarea,.editor input,.editor select{width:100%;padding:9px;border:1px solid #ead9e3;border-radius:10px;background:#fffafd;font:inherit;margin-top:7px}.editor textarea{min-height:90px}.editor .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid #ead9e3;box-shadow:0 -5px 20px #ba8cac18;padding:9px max(10px,calc((100% - 900px)/2));}.tools{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px}.tool{flex:none;border:1px solid #ead9e3;border-radius:18px;background:#fff8fc;color:#86677f;padding:8px 12px;cursor:pointer;font:inherit;white-space:nowrap}.chars{display:flex;gap:10px;overflow-x:auto}.char{border:0;background:transparent;flex:none;color:#80657d;cursor:pointer;text-align:center;font:inherit;font-size:.75rem}.char .mini{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;overflow:hidden;margin:auto;background:#eadcf7}.mini img{width:100%;height:100%;object-fit:cover}.modal{position:fixed;inset:0;background:#3c2b3b66;display:none;z-index:10;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modal-box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.modal-box h2{margin-top:0;color:#a26c91}.modal-box label{display:block;margin-top:12px;color:#8d6c86;font-weight:bold}.modal-box textarea,.modal-box input,.modal-box select{width:100%;padding:10px;border:1px solid #ead9e3;border-radius:10px;margin-top:5px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:0;border-radius:20px;padding:9px 14px;cursor:pointer;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:#fff;font:inherit}.btn.light{background:#eee4f5;color:#85678d}.status{color:#a26c91;min-height:20px}@media(max-width:600px){.top{grid-template-columns:1fr 1.6fr 1fr;padding:7px}.top a,.top button{font-size:.72rem;padding:7px}.top input{font-size:.82rem}.page{padding:12px 8px 190px}.paper{padding:18px 12px}.editor .row{grid-template-columns:1fr}.bubble{max-width:80%}}
</style></head><body>
<header class="top"><div class="top-left"><a href="novel.html" id="back">←</a><button id="editToggle">編集</button></div><input id="chapterTitle" placeholder="チャプターのタイトル"><div class="top-right"><button id="draft">下書き保存</button><button id="publish">公開</button><span class="count" id="count">0文字</span></div></header>
<main class="page"><section id="paper" class="paper"><div class="empty" id="empty">本文を追加してください。下部のツールバーから普通の文章やキャラクターを選べます。</div><div id="blocks"></div></section><section id="editor" class="editor"></section><p id="status" class="status"></p></main>
<nav class="bottom"><div class="tools"><button class="tool" data-tool="text">① 編集</button><button class="tool" data-tool="background">② 背景</button><button class="tool" data-tool="art">③ 挿絵</button><button class="tool" data-tool="characters">④ キャラクター</button><button class="tool" data-tool="poll">⑤ アンケート</button><button class="tool" data-tool="link">小説リンク</button><button class="tool" data-tool="stamp">スタンプ</button><button class="tool" data-tool="call">電話</button><button class="tool" data-tool="deco">装飾</button><button class="tool" data-tool="dream">夢主の名前</button><button class="tool" data-tool="message">メッセージ</button></div><div id="chars" class="chars"></div></nav>
<div id="modal" class="modal"><div class="modal-box"><h2 id="modalTitle">追加</h2><div id="modalBody"></div><div class="modal-actions"><button id="modalCancel" class="btn light">キャンセル</button><button id="modalOk" class="btn" type="button">追加</button></div></div></div>
<input id="fileInput" type="file" accept="image/*" hidden><script>
const MAX_CHARS=20000000000;const aid=localStorage.getItem('yumeWorldActiveAccount')||'guest',params=new URLSearchParams(location.search),novelId=params.get('account')||aid,chapterId=params.get('chapter')||'new',NOVEL='yumeWorldNovelV3',KEY=novelId==='guest'?NOVEL:NOVEL+':'+novelId,CHARKEY='yumeWorldCharactersV2:'+novelId,$=id=>document.getElementById(id);let data={title:'',chapters:[],characters:[]},chapter={id:chapterId,title:'',body:'',blocks:[],background:'',bgOpacity:.16,bgBlur:'none',status:'draft',publishAt:''},characters=[];const shapes={standard:'standard',heart:'heart',round:'round',cloud:'cloud',ribbon:'ribbon',crystal:'crystal',drop:'drop',square:'square'};
function esc(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}function read(){try{data=Object.assign(data,JSON.parse(localStorage.getItem(KEY)||'{}'));characters=JSON.parse(localStorage.getItem(CHARKEY)||'[]');if(!characters.length)characters=data.characters||[];const found=(data.chapters||[]).find(x=>x.id===chapterId);if(found)chapter=Object.assign(chapter,found);else if(chapterId==='new'){chapter.id='ch-'+Date.now();chapter.title='';chapter.blocks=[];data.chapters=data.chapters||[]}}catch(e){}}function save(){chapter.title=$('chapterTitle').value;chapter.body=chapter.blocks.map(x=>x.text||x.question||x.body||'').join('\n');if(chapter.body.length>MAX_CHARS){msg('本文が上限を超えています');return false}const i=(data.chapters||[]).findIndex(x=>x.id===chapter.id);if(i<0)(data.chapters||[]).push(chapter);else data.chapters[i]=chapter;try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){msg('保存容量を超えたため、表示のみ更新しました。画像を減らすと保存できます。');return false}}function msg(t){$('status').textContent=t;setTimeout(()=>$('status').textContent='',2500)}function count(){const n=chapter.blocks.reduce((s,b)=>s+(b.text||b.question||b.body||'').length,0);$('count').textContent=n.toLocaleString()+' / 20,000,000,000文字'}function imgRead(file){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(file)})}
function render(){const p=$('paper');p.style.setProperty('--chapter-bg',chapter.background?`url(${chapter.background})`:'none');p.style.setProperty('--bg-opacity',chapter.bgOpacity||.16);p.style.setProperty('--bg-filter',chapter.bgBlur||'none');$('chapterTitle').value=chapter.title||'';$('blocks').innerHTML='';$('empty').style.display=chapter.blocks.length?'none':'block';chapter.blocks.forEach((b,i)=>{const e=document.createElement('div');e.className='block';e.innerHTML=blockHtml(b,i);e.querySelector('.remove').onclick=()=>{chapter.blocks.splice(i,1);save();render()};e.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editBlock(i));$('blocks').append(e)});count();renderChars();renderEditor()}function blockHtml(b,i){let content='';if(b.type==='text'||b.type==='message')content=`<div class="${b.type==='message'?'message':'text'}">${esc(b.text)}</div>`;else if(b.type==='speech'){content=`<div class="bubble-row ${b.side==='right'?'right':''}"><div class="bubble-icon">${b.icon?`<img src="${b.icon}">`:'👤'}</div><div><div class="bubble-name">${esc(b.name)}</div><div class="bubble ${shapes[b.shape]||'standard'} pattern-${b.pattern||'plain'} ${b.message?'message-bubble':''}" style="background-color:${b.color||'#f8d8e8'}">${esc(b.text)}</div>${b.read?' <div class="small-read">既読</div>':''}</div></div>`}else if(b.type==='image'||b.type==='stamp')content=`<div class="art ${b.type==='stamp'?'stamp':''} ${b.side==='right'?'media-right':'media-left'}"><img src="${b.src}" alt="${b.type==='stamp'?'スタンプ':'挿絵'}"></div>`;else if(b.type==='poll')content=`<div class="poll"><h3>アンケート</h3><strong>${esc(b.question)}</strong>${(b.options||[]).map(x=>`<label><input type="radio" name="poll${i}"> ${esc(x)}</label>`).join('')}</div>`;else if(b.type==='link')content=`<div class="novel-link"><h3>小説リンク</h3><a href="${esc(b.url||'#')}">${esc(b.label||'作品を読む')}</a></div>`;else if(b.type==='call')content=`<div class="call"><strong>☎ 通話終了</strong><span>${esc(b.time||'通話時間 00:00')}</span></div>`;else if(b.type==='deco')content=`<div class="deco">${esc(b.value||'♡ ─── ♡')}</div>`;return content+`<div class="block-tools"><button data-edit="1">編集</button><button class="remove">削除</button></div>`}
function renderChars(){const c=$('chars');c.innerHTML='<button class="char" data-special="text"><span class="mini">＋</span>文章</button>'+characters.map((x,i)=>`<button class="char" data-ci="${i}"><span class="mini">${x.icons?.[0]||x.icon?`<img src="${x.icons?.[0]||x.icon}">`:'👤'}</span>${esc(x.name||'キャラクター')}</button>`).join('');c.querySelector('[data-special]').onclick=()=>addText();c.querySelectorAll('[data-ci]').forEach(x=>x.onclick=()=>addSpeech(characters[+x.dataset.ci]))}
function addText(){openModal('普通の文章','<label>本文</label><textarea id="mText" placeholder="文章を入力"></textarea>',()=>{chapter.blocks.push({type:'text',text:$('mText').value});save();render()})}function addMessage(){const opts=characters.map((c,i)=>`<option value="${i}">${esc(c.name||'キャラクター')}</option>`).join('');openModal('メッセージ（吹き出し）',`<label>キャラクター</label><select id="mChar">${opts||'<option value="-1">キャラクター未登録</option>'}</select><label>メッセージ</label><textarea id="mText" placeholder="小声・短いメッセージ"></textarea><label><input id="mRead" type="checkbox"> 既読を表示</label>`,()=>{const c=characters[+$('mChar').value]||{};chapter.blocks.push({type:'speech',message:true,name:c.name||'メッセージ',icon:c.icons?.[0]||c.icon||'',icons:c.icons||[],characterId:c.id||'',side:c.side||'left',shape:c.shape||'standard',color:c.color||'#f8d8e8',pattern:c.pattern||'plain',text:$('mText').value,read:$('mRead').checked});save();render()})}function addSpeech(c){const opts=(c?.icons||[]).map((x,i)=>`<option value="${i}">アイコン${i+1}</option>`).join('');openModal((c?.type==='dream'?'夢主':'キャラクター')+'の吹き出し',`<label>文章</label><textarea id="mText"></textarea><label>アイコン</label><select id="mIcon">${opts||'<option value="-1">登録画像なし</option>'}</select><label>既読</label><input id="mRead" type="checkbox"> 既読を表示`,()=>{const ix=+$('mIcon').value;chapter.blocks.push({type:'speech',name:c?.name||'キャラクター',icon:c?.icons?.[ix>=0?ix:0]||c?.icon||'',icons:c?.icons||[],characterId:c?.id||'',side:c?.side||'left',shape:c?.shape||'standard',color:c?.color||'#f8d8e8',pattern:c?.pattern||'plain',text:$('mText').value,read:$('mRead').checked});save();render()})}
function editBlock(i){const b=chapter.blocks[i];if(b.type==='speech'){openModal('吹き出しを編集',`<label>名前</label><input id="mName" value="${esc(b.name)}"><label>文章</label><textarea id="mText">${esc(b.text)}</textarea><div class="editor row"><div><label>左右</label><select id="mSide"><option value="left">左</option><option value="right">右</option></select></div><div><label>形</label><select id="mShape"><option>standard</option><option>heart</option><option>round</option><option>cloud</option><option>ribbon</option><option>crystal</option><option>drop</option><option>square</option></select></div></div><label>色</label><input id="mColor" type="color" value="${b.color||'#f8d8e8'}"><label>模様</label><select id="mPattern"><option>plain</option><option>dots</option><option>stripes</option><option>check</option><option>heart</option><option>star</option><option>sparkle</option></select><label><input id="mRead" type="checkbox"> 既読を表示</label>`,()=>{Object.assign(b,{name:$('mName').value,text:$('mText').value,side:$('mSide').value,shape:$('mShape').value,color:$('mColor').value,pattern:$('mPattern').value,read:$('mRead').checked});save();render()});setTimeout(()=>{$('mSide').value=b.side||'left';$('mShape').value=b.shape||'standard';$('mPattern').value=b.pattern||'plain';$('mRead').checked=!!b.read},0)}else{openModal('本文を編集','<textarea id="mText"></textarea>',()=>{b.text=$('mText').value;save();render()});setTimeout(()=>$('mText').value=b.text||'',0)}}
function openModal(title,html,ok){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open');const add=$('modalOk');add.disabled=false;add.textContent='追加';add.onclick=async()=>{if(add.disabled)return;add.disabled=true;add.textContent='追加中…';$('modal').classList.remove('open');try{await ok()}catch(e){msg('追加できませんでした: '+(e.message||e))}};$('modalCancel').onclick=()=>{$('modal').classList.remove('open')}}function imageBlock(kind){const title=kind==='stamp'?'スタンプ画像':'挿絵画像';openModal(title,'<label>画像ファイル</label><input id="mediaFile" type="file" accept="image/*"><label>表示位置</label><select id="mediaSide"><option value="left">左</option><option value="right">右</option></select><label><input id="mediaConfirm" type="checkbox"> この画像を本文に挿入する</label><p class="hint">画像を選択し、位置を選び、チェックを入れてから「追加」を押してください。</p>',()=>{});const add=$("modalOk");add.onclick=async()=>{const input=$("mediaFile"),check=$("mediaConfirm"),f=input&&input.files&&input.files[0];if(!f){msg('画像を選択してください');return}if(!check.checked){msg('チェックを入れると画像を挿入できます');return}add.disabled=true;add.textContent='読み込み中…';try{const src=await imgRead(f);chapter.blocks.push({type:kind,src,size:kind==='stamp'?'small':'full',side:$("mediaSide").value});save();render();$("modal").classList.remove('open');msg(kind==='stamp'?'スタンプを追加しました':'挿絵を追加しました')}catch(e){add.disabled=false;add.textContent='追加';msg('画像を追加できませんでした: '+(e.message||e))}}}
function editBackground(){openModal('チャプター背景','<label>背景画像</label><input id="bgFile" type="file" accept="image/*"><label><input id="bgConfirm" type="checkbox"> この画像を背景に設定する</label><p class="hint">画像を選択し、チェックを入れてから「追加」を押してください。</p><label>ぼかし</label><select id="bgBlur"><option value="none">ぼかしなし</option><option value="blur(1px)">弱いぼかし</option><option value="blur(3px)">普通のぼかし</option><option value="blur(6px)">強いぼかし</option><option value="blur(2px)">ふんわりぼかし</option></select><label>透明度</label><input id="bgOpacity" type="range" min="0" max=".8" step=".05" value="${chapter.bgOpacity||.16}">',async()=>{const input=$('bgFile'),check=$('bgConfirm'),f=input?.files?.[0],allowed=!!check?.checked;if(!f){msg('背景画像を選択してください');return}if(!allowed){msg('チェックを入れると背景に設定できます');return}chapter.background=await imgRead(f);chapter.bgBlur=$('bgBlur').value;chapter.bgOpacity=+$('bgOpacity').value;save();render();msg('背景を設定しました')})}
function addPoll(){openModal('アンケート','<label>質問文</label><input id="mQ"><label>選択肢（1行に1つ）</label><textarea id="mOpts" placeholder="選択肢A\n選択肢B"></textarea>',()=>{chapter.blocks.push({type:'poll',question:$('mQ').value,options:$('mOpts').value.split('\n').map(x=>x.trim()).filter(Boolean)});save();render()})}function addLink(){openModal('小説リンク','<label>表示名</label><input id="mLabel" value="おすすめ作品"><label>リンクURL</label><input id="mUrl" placeholder="novel.html?account=...">',()=>{chapter.blocks.push({type:'link',label:$('mLabel').value,url:$('mUrl').value});save();render()})}function addCall(){openModal('電話・通話','<label>通話時間</label><input id="mTime" placeholder="通話時間 08:32">',()=>{chapter.blocks.push({type:'call',time:$('mTime').value});save();render()})}function addDeco(){openModal('装飾','<label>デザイン</label><select id="mDeco"><option>♡ ─── ♡</option><option>୨୧ ───── ୨୧</option><option>⋆｡°✩</option><option>✧･ﾟ: *✧･ﾟ:*</option></select>',()=>{chapter.blocks.push({type:'deco',value:$('mDeco').value});save();render()})}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;if(t==='text')addText();else if(t==='background')editBackground();else if(t==='art')imageBlock('image');else if(t==='stamp')imageBlock('stamp');else if(t==='characters')document.querySelector('.chars').scrollIntoView({behavior:'smooth'});else if(t==='poll')addPoll();else if(t==='link')addLink();else if(t==='call')addCall();else if(t==='deco')addDeco();else if(t==='dream')addTextWithDream();else if(t==='message')addMessage()});function addTextWithDream(){openModal('夢主の名前','<p>本文には内部変数 <code>{{夢主}}</code> を保存します。</p><label>文章</label><textarea id="mText">{{夢主}}</textarea>',()=>{chapter.blocks.push({type:'text',text:$('mText').value});save();render()})}$('draft').onclick=()=>{try{save();chapter.status='draft';save();msg('下書きを保存しました')}catch(e){msg(e.message)}};$('publish').onclick=()=>{openModal('公開設定','<label><input id="now" type="radio" name="pub" checked> 今すぐ公開</label><label><input id="later" type="radio" name="pub"> 公開日時を指定</label><input id="pubDate" type="datetime-local">',()=>{chapter.status=$('later').checked?'scheduled':'public';chapter.publishAt=$('pubDate').value;save();msg(chapter.status==='public'?'公開しました':'公開日時を保存しました')})};$('editToggle').onclick=()=>{$('editor').scrollIntoView({behavior:'smooth'})};$('chapterTitle').oninput=()=>{chapter.title=$('chapterTitle').value;count()};read();render();
</script></body></html>
