<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラクター管理｜YUME WORLD</title><style>
*{box-sizing:border-box}body{margin:0;color:#625665;font-family:"Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff7fb,#f3f0ff);min-height:100vh}.page{max-width:820px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{margin:0;color:#a56f93;font-size:1.45rem}.btn{border:0;border-radius:22px;padding:10px 16px;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:#fff;cursor:pointer;font:inherit;font-weight:700}.btn.light{background:#eee4f5;color:#85678d}.btn.danger{background:#f4dfe8;color:#a36b86}.list{display:flex;flex-direction:column;gap:12px}.character{display:flex;align-items:center;gap:15px;padding:14px 16px;border-radius:18px;background:#fff;box-shadow:0 5px 18px #ae86ae18;border:1px solid #fff}.avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#f7c9df,#dcd0ff);display:grid;place-items:center;flex:none;overflow:hidden;color:#fff;font-size:28px}.avatar img{width:100%;height:100%;object-fit:cover}.character-info{flex:1;min-width:0}.character-info h2{margin:0 0 5px;color:#9f7090;font-size:1.1rem;word-break:break-word}.type{display:inline-block;border-radius:14px;padding:4px 9px;font-size:.78rem;background:#f8e4ef;color:#a26c91}.type.dream{background:#e8e0fa;color:#8269a9}.sub{font-size:.82rem;color:#9b8998;margin-top:6px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:30px;text-align:center;color:#a18c9d;background:#fff;border-radius:18px}.modal{position:fixed;inset:0;background:#3c2b3b66;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}.modal.open{display:flex}.panel{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 15px 45px #3c2b3b33}.panel h2{margin:0;color:#a56f93}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choice button{padding:20px 12px;border:1px solid #ead9e3;border-radius:17px;background:#fff8fc;color:#8d6c86;cursor:pointer;font:inherit;font-weight:700}.choice button:hover{border-color:#d99bc0;background:#fff0f8}.form{display:none}.form.open{display:block}label{display:block;margin:14px 0 6px;color:#8d6c86;font-weight:700}input[type=text],select{width:100%;padding:11px;border:1px solid #ead9e3;border-radius:12px;background:#fffafd;font:inherit}input[type=color]{width:70px;height:42px;border:0;background:none}.radio{display:flex;gap:20px;flex-wrap:wrap}.radio label{margin:0;font-weight:400;display:flex;align-items:center;gap:6px}.radio input{accent-color:#d99bc0}.icons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.icon-thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;border:2px solid #ead9e3}.icon-file{margin-top:5px}.hint,.status{font-size:.82rem;color:#9b8998}.status{min-height:20px;color:#a26c91}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.form-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.form-title h3{color:#a56f93;margin:0}.preview{margin-top:14px;padding:14px;border-radius:15px;background:#fff8fc;display:flex;align-items:center;gap:12px}.preview-bubble{padding:10px 14px;border-radius:18px;word-break:break-word}.preview-bubble.round{border-radius:50px}.preview-bubble.square{border-radius:4px}.preview-bubble.heart{border-radius:45% 45% 45% 10%}.preview-bubble.cloud{border-radius:40px}.preview-bubble.ribbon{border-left:10px solid #fff8}.preview-bubble.crystal{transform:skew(-2deg)}.preview-bubble.drop{border-radius:50% 50% 50% 8%}@media(max-width:600px){.page{padding:10px}.top{align-items:flex-start}.top h1{font-size:1.2rem}.character{align-items:flex-start;padding:12px}.avatar{width:58px;height:58px}.actions{width:100%;justify-content:flex-start}.actions .btn{padding:8px 12px}.choice{grid-template-columns:1fr}.panel{padding:17px}}

.lumi-page-art{max-width:1000px;margin:14px auto 0;padding:0 16px;position:relative;z-index:0}.lumi-page-art__inner{position:relative;min-height:118px;overflow:hidden;border:1px solid #eadcf3;border-radius:24px;background:linear-gradient(105deg,#f4f2ff,#fff7fb 58%,#f0f8ff);box-shadow:0 8px 25px #ae86ae18}.lumi-page-art img{position:absolute;right:0;top:-18px;width:54%;height:160px;object-fit:cover;object-position:center 40%;mix-blend-mode:multiply;opacity:.92}.lumi-page-art__copy{position:relative;z-index:1;width:52%;padding:29px 25px;color:#98749a;font-size:clamp(15px,2vw,21px);font-weight:700;letter-spacing:.04em}.lumi-page-art__copy::before{content:'✦';display:block;margin-bottom:4px;color:#dba5c5;font-size:16px}.lumi-page-art--reader .lumi-page-art__inner{background:linear-gradient(105deg,#f2f6ff,#fffafe)}.lumi-page-art--write .lumi-page-art__inner{background:linear-gradient(105deg,#fff7fc,#f0f6ff)}@media(max-width:650px){.lumi-page-art{padding:0 10px;margin-top:10px}.lumi-page-art__inner{min-height:95px;border-radius:18px}.lumi-page-art img{top:-5px;width:58%;height:110px;opacity:.78}.lumi-page-art__copy{width:58%;padding:22px 15px;font-size:14px}.lumi-page-art__copy::before{font-size:13px}}
<style id="yume-bubble-visuals">
.bubble,.preview-bubble{position:relative}.bubble.standard,.preview-bubble.standard{border-radius:20px}.bubble.round,.preview-bubble.round{border-radius:50px}.bubble.square,.preview-bubble.square{border-radius:5px}.bubble.heart,.preview-bubble.heart{border-radius:50% 50% 46% 46%;transform:rotate(-2deg)}.bubble.cloud,.preview-bubble.cloud{border-radius:40px;box-shadow:0 0 0 3px #ffffff55 inset,0 3px 8px #b88aa633}.bubble.ribbon,.preview-bubble.ribbon{border-radius:9px;border:3px solid #ffffff88;box-shadow:0 0 0 4px #d99bc055 inset}.bubble.crystal,.preview-bubble.crystal{clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%)}.bubble.drop,.preview-bubble.drop{border-radius:50% 50% 50% 8%;transform:rotate(-1deg)}.bubble.pattern-dots,.preview-bubble.pattern-dots{background-image:radial-gradient(#ffffffaa 1.5px,transparent 1.5px)!important;background-size:9px 9px}.bubble.pattern-stripes,.preview-bubble.pattern-stripes{background-image:repeating-linear-gradient(45deg,#ffffff44 0 5px,transparent 5px 10px)!important}.bubble.pattern-check,.preview-bubble.pattern-check{background-image:linear-gradient(#ffffff33 1px,transparent 1px),linear-gradient(90deg,#ffffff33 1px,transparent 1px)!important;background-size:10px 10px}.bubble.pattern-heart,.preview-bubble.pattern-heart{background-image:radial-gradient(#ffffffaa 2px,transparent 2px)!important;background-size:22px 20px}.bubble.pattern-star,.preview-bubble.pattern-star{background-image:radial-gradient(#ffffffbb 2px,transparent 2px)!important;background-size:27px 25px}.bubble.pattern-sparkle,.preview-bubble.pattern-sparkle{background-image:radial-gradient(#ffffffcc 1px,transparent 1px)!important;background-size:13px 13px}
</style></style></head><body><section class="lumi-page-art lumi-page-art--characters" aria-label="ルミの案内"><div class="lumi-page-art__inner"><img src="lumi-characters.png" alt="ルミ：登場人物の夢を書き留めよう"><div class="lumi-page-art__copy">登場人物の夢を書き留めよう</div></div></section><main class="page"><div class="top"><h1>👥 キャラクター管理</h1><div><a href="mypage.html" class="btn light" style="text-decoration:none">マイページ</a> <button id="addButton" class="btn" type="button">＋ キャラクターを追加</button></div></div><div id="list" class="list"></div></main><div id="modal" class="modal"><section class="panel"><div id="chooser"><div class="form-title"><h2>キャラクターを追加</h2><button class="btn light close" type="button">閉じる</button></div><div class="choice"><button data-type="dream" type="button">🌙 夢主を作成</button><button data-type="character" type="button">✨ 普通のキャラクターを作成</button></div></div><div id="form" class="form"><div class="form-title"><h3 id="formHeading">キャラクターを作成</h3><button class="btn light back" type="button">戻る</button></div><label id="nameLabel">名前／呼び名</label><input id="name" type="text" placeholder="例：モブ子"><label>アイコン画像（最大5枚）</label><input id="iconInput" class="icon-file" type="file" accept="image/*" multiple><p class="hint">登録済み画像から本文で使うアイコンを選択できます。最大5枚。</p><div id="icons" class="icons"></div><label>吹き出しの左右</label><div class="radio"><label><input type="radio" name="side" value="left" checked>左</label><label><input type="radio" name="side" value="right">右</label></div><label>吹き出しの形</label><select id="shape"><option value="standard">スタンダード</option><option value="heart">ハート</option><option value="round">丸</option><option value="cloud">雲</option><option value="ribbon">リボン</option><option value="crystal">クリスタル</option><option value="drop">しずく</option><option value="square">四角</option></select><label>吹き出しの色</label><input id="color" type="color" value="#f8d8e8"><label>吹き出しの模様</label><select id="pattern"><option value="plain">無地</option><option value="dots">ドット</option><option value="stripes">ストライプ</option><option value="check">チェック</option><option value="heart">ハート</option><option value="star">星</option><option value="sparkle">キラキラ</option></select><div class="preview"><div id="previewAvatar" class="avatar">👤</div><div id="previewBubble" class="preview-bubble">セリフのプレビュー</div></div><p id="status" class="status"></p><div class="form-actions"><button id="cancel" class="btn light" type="button">キャンセル</button><button id="save" class="btn" type="button">保存する</button></div></div></section></div><script>
const ACCOUNT='yumeWorldActiveAccount',OLD='yumeWorldCharacters',NOVEL='yumeWorldNovelV3',aid=localStorage.getItem(ACCOUNT)||'guest',KEY='yumeWorldCharactersV2:'+aid,$=id=>document.getElementById(id);const SHAPES={standard:'スタンダード',heart:'ハート',round:'丸',cloud:'雲',ribbon:'リボン',crystal:'クリスタル',drop:'しずく',square:'四角'};let chars=[],type='character',editing=null,icons=[];
function imageRead(f){return new Promise(r=>{const q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(f)})}function esc(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}function read(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(saved)){chars=saved;return}const novel=JSON.parse(localStorage.getItem(aid==='guest'?NOVEL:NOVEL+':'+aid)||'null');if(novel?.characters?.length){chars=novel.characters.map(c=>Object.assign({type:'character',icons:c.icons||[],shape:c.shape||'standard',pattern:c.pattern||'plain'},c));save();return}const old=JSON.parse(localStorage.getItem(OLD)||'[]');chars=old.map(c=>Object.assign({type:'character',icons:c.icon?[c.icon]:[],shape:'standard',pattern:'plain'},c));save()}catch(e){chars=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(chars));try{const nk=aid==='guest'?NOVEL:NOVEL+':'+aid;const n=JSON.parse(localStorage.getItem(nk)||'null');if(n){n.characters=chars;localStorage.setItem(nk,JSON.stringify(n))}}catch(e){}}function render(){const list=$('list');if(!chars.length){list.innerHTML='<div class="empty">まだキャラクターが登録されていません。<br>「＋ キャラクターを追加」から作成できます。</div>';return}list.innerHTML='';chars.forEach((c,i)=>{const row=document.createElement('article');row.className='character';const img=c.icons?.[0]||c.icon;row.innerHTML=`<div class="avatar">${img?`<img src="${img}" alt="">`:'👤'}</div><div class="character-info"><h2>${esc(c.name||'名前未設定')}</h2><span class="type ${c.type==='dream'?'dream':''}">${c.type==='dream'?'夢主':'キャラクター'}</span><div class="sub">${c.side==='right'?'右':'左'}・${SHAPES[c.shape]||'スタンダード'}・アイコン${c.icons?.length||0}枚</div></div><div class="actions"><button class="btn light edit" type="button">編集</button><button class="btn danger delete" type="button">削除</button></div>`;row.querySelector('.edit').onclick=()=>openForm(c,i);row.querySelector('.delete').onclick=()=>{if(confirm('このキャラクターを削除しますか？過去の本文は削除されません。')){chars.splice(i,1);save();render()}};list.append(row)})}function openChooser(){$('modal').classList.add('open');$('chooser').style.display='block';$('form').classList.remove('open')}function openForm(c=null,i=null){editing=i;type=c?.type||type;icons=c?.icons?[...c.icons]:[];$('formHeading').textContent=c?'キャラクターを編集':(type==='dream'?'夢主を作成':'普通のキャラクターを作成');$('nameLabel').textContent=type==='dream'?'呼び名':'名前';$('name').value=c?.name||'';document.querySelector('input[name=side][value="'+(c?.side||'left')+'"]').checked=true;$('shape').value=c?.shape||'standard';$('color').value=c?.color||'#f8d8e8';$('pattern').value=c?.pattern||'plain';$('iconInput').value='';renderIcons();updatePreview();$('chooser').style.display='none';$('form').classList.add('open');$('modal').classList.add('open')}function renderIcons(){$('icons').innerHTML=icons.map((x,i)=>`<img class="icon-thumb" src="${x}" alt="アイコン${i+1}">`).join('');$('previewAvatar').innerHTML=icons[0]?`<img src="${icons[0]}" alt="">`:'👤'}function normalizeShape(v){return {スタンダード:'standard',ハート:'heart',丸:'round',雲:'cloud',リボン:'ribbon',クリスタル:'crystal',しずく:'drop',四角:'square'}[v]||v||'standard'}function normalizePattern(v){return {無地:'plain',ドット:'dots',ストライプ:'stripes',チェック:'check',ハート:'heart',星:'star',キラキラ:'sparkle'}[v]||v||'plain'}function updatePreview(){const p=$('previewBubble');const shape=normalizeShape($('shape').value),pattern=normalizePattern($('pattern').value);p.textContent=$('name').value||'セリフのプレビュー';p.style.backgroundColor=$('color').value;p.className='preview-bubble '+shape+' pattern-'+pattern}$('addButton').onclick=()=>{editing=null;openChooser()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;openForm()});document.querySelectorAll('.close,.back,.cancel').forEach(b=>b.onclick=()=>{$('modal').classList.remove('open')});$('iconInput').onchange=async e=>{icons=await Promise.all([...e.target.files].slice(0,5).map(imageRead));renderIcons()};['name','shape','color','pattern'].forEach(id=>{ $(id).addEventListener('input',updatePreview); $(id).addEventListener('change',updatePreview) });$('save').onclick=()=>{const name=$('name').value.trim();if(!name){$('status').textContent='名前／呼び名を入力してください。';return}const c={id:editing===null?'char-'+Date.now():chars[editing].id,type,name,icons:[...icons],side:document.querySelector('input[name=side]:checked').value,shape:normalizeShape($('shape').value),color:$('color').value,pattern:normalizePattern($('pattern').value)};if(editing===null)chars.push(c);else chars[editing]=c;save();$('modal').classList.remove('open');render()};read();render();
</script></body></html>
