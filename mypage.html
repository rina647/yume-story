<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページ｜YUME WORLD</title><script src="official-accounts.js?v=d507418"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fc;color:#5d5260;font-family:"Yu Gothic",sans-serif}.page{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.top a,.btn{border:0;border-radius:22px;padding:10px 15px;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:#fff;text-decoration:none;cursor:pointer}.profile{overflow:hidden;border-radius:24px;background:#fff;box-shadow:0 6px 25px #00000012}.profile-cover{height:210px;background:linear-gradient(135deg,#f7c9df,#dcd0ff);background-size:cover;background-position:center}.profile-main{text-align:center;padding:0 22px 25px}.avatar{width:104px;height:104px;border-radius:50%;margin:-52px auto 10px;border:5px solid #fff;background:linear-gradient(135deg,#d99bc0,#bca9e8);display:grid;place-items:center;color:#fff;font-size:40px;position:relative;overflow:visible}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.crown{position:absolute;right:-9px;top:-17px;font-size:28px;text-shadow:0 1px 3px #777}.gold{filter:sepia(1) saturate(5) hue-rotate(350deg)}.blue{filter:hue-rotate(175deg) saturate(2)}h1{margin:6px 0;color:#a46d91}.badge{display:inline-block;border-radius:13px;padding:4px 9px;color:#fff;font-size:12px}.operator{background:#d49b2c}.author{background:#508dcc}.profile-text{margin:14px auto;max-width:680px;white-space:pre-wrap;line-height:1.8;padding:14px;border-radius:16px;background:#fff8fc}.profile-text.left{text-align:left}.profile-text.right{text-align:right}.profile-text.center{text-align:center}.profile-text.bold{font-weight:700}.profile-text.italic{font-style:italic}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ead9e3;margin-top:18px}.stat{background:#fff;padding:15px;text-align:center}.stat strong{display:block;font-size:22px;color:#b8759c}.section{background:#fff;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 5px 20px #0000000d}.section h2{color:#bd79a2;border-left:5px solid #dca6c7;padding-left:10px}.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.work{display:flex;gap:12px;padding:12px;border:1px solid #ead9e3;border-radius:15px;background:#fffafd}.cover{width:72px;height:94px;flex:none;border-radius:9px;object-fit:cover;background:linear-gradient(135deg,#f7c9df,#dcd0ff);display:grid;place-items:center;color:#fff;text-align:center}.work h3{margin:3px 0;color:#9f7090}.work p{font-size:13px;margin:5px 0;line-height:1.5}.work button{margin-top:5px}.empty{color:#999}.editor{display:none;background:#fff;padding:20px;border-radius:20px;margin-top:18px;box-shadow:0 5px 20px #00000010}.editor.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin-top:9px;font-size:13px;color:#8f7187}input,textarea,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ead9e3;border-radius:11px;background:#fffafd}textarea{min-height:100px}.design-preview{padding:15px;margin-top:10px;border-radius:15px;min-height:85px;white-space:pre-wrap;background:#fff8fc}.message{color:#a26c91;min-height:22px}.line{padding:8px;border:1px solid #ead9e3;border-radius:10px;cursor:pointer;margin-top:6px}.line:hover{background:#fff0f8}@media(max-width:650px){.page{padding:10px}.profile-cover{height:160px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.top h2{font-size:18px}}
</style></head><body><main class="page"><div class="top"><h2>🌙 マイページ</h2><div><a href="index.html">ホーム</a> <a href="write.html" class="btn">＋ 新しい小説を書く</a></div></div><section class="profile"><div id="cover" class="profile-cover"></div><div class="profile-main"><div id="avatar" class="avatar"></div><h1 id="name">ゲスト</h1><div id="badge"></div><div id="bio" class="profile-text">プロフィール文はまだありません。</div><button id="editButton" class="btn">プロフィールを編集</button><div class="stats"><div class="stat"><strong id="novelCount">0</strong>小説数</div><div class="stat"><strong id="favoriteCount">0</strong>お気に入り</div><div class="stat"><strong id="following">0</strong>フォロー</div><div class="stat"><strong id="followers">0</strong>フォロワー</div></div></div></section><section class="section"><h2>📚 公開中の小説</h2><div id="published" class="works"></div></section><section class="section"><h2>📝 保存した小説</h2><p class="empty">下書き・非公開の作品は本人だけに表示されます。</p><div id="drafts" class="works"></div></section><section id="editor" class="editor"><h2>プロフィールを編集</h2><div class="grid"><div><label>名前</label><input id="editName"><label>アイコン画像</label><input id="iconInput" type="file" accept="image/*"><label>プロフィール背景画像</label><input id="bgInput" type="file" accept="image/*"><label>プロフィール文</label><textarea id="editBio" placeholder="夢小説を書いています♡"></textarea></div><div><label>文字サイズ</label><select id="bioSize"><option value="14px">小</option><option value="16px">標準</option><option value="20px">大</option><option value="25px">特大</option></select><label>文字位置</label><select id="bioAlign"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select><label>文字色</label><input id="bioColor" type="color" value="#8f7187"><label>背景色</label><input id="bioBg" type="color" value="#fff8fc"><div class="line" data-line="♡ ─── ♡">♡ ─── ♡</div><div class="line" data-line="୨୧ ───── ୨୧">୨୧ ───── ୨୧</div><div class="line" data-line="⋆｡°✩">⋆｡°✩</div><div class="line" data-line="✧･ﾟ: *✧･ﾟ:*">✧･ﾟ: *✧･ﾟ:*</div></div></div><div id="bioPreview" class="design-preview"></div><button id="saveProfile" class="btn">保存する</button><button id="cancelEdit" class="btn" style="background:#eadcf7;color:#8f6b94">キャンセル</button><div id="message" class="message"></div></section></main><script>
const PROFILE_PREFIX='yumeWorldProfileV1:',ACCOUNT_KEY='yumeWorldAccountsV1',ACTIVE_KEY='yumeWorldActiveAccount',NOVEL_BASE='yumeWorldNovelV3';const $=id=>document.getElementById(id);const viewerAid=localStorage.getItem(ACTIVE_KEY)||'guest';const requestedAid=new URLSearchParams(location.search).get('account');const aid=requestedAid||viewerAid;const isOwner=aid===viewerAid;const profileKey=PROFILE_PREFIX+aid;let profile={name:'ゲスト',icon:'',background:'',bio:'プロフィール文はまだありません。',bioSize:'16px',bioAlign:'center',bioColor:'#8f7187',bioBg:'#fff8fc'};try{profile=Object.assign(profile,JSON.parse(localStorage.getItem(profileKey)||'{}'))}catch(e){};
function accounts(){try{return JSON.parse(localStorage.getItem(ACCOUNT_KEY)||'[]')}catch(e){return []}}function active(){return accounts().find(a=>a.id===aid)||null}function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function type(a){const x=window.YUME_OFFICIAL_ACCOUNTS||{operators:[],authors:[]};return x.operators.includes(a?.id)?'operator':x.authors.includes(a?.id)?'author':''}function crown(t){return t?`<span class="crown ${t==='operator'?'gold':'blue'}">♛</span>`:''}function imageRead(f){return new Promise(r=>{const q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(f)})}
function novel(){const key=aid==='guest'?NOVEL_BASE:NOVEL_BASE+':'+aid;try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}function workCard(n,isDraft){const d=document.createElement('article');d.className='work';d.innerHTML=`<div class="cover">${n?.cover?`<img src="${n.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:9px">`:'YUME<br>WORLD'}</div><div><h3>${esc(n?.title||'無題の小説')}</h3><p>${esc(n?.novelInfo?.genre||'その他')} ${esc((n?.novelInfo?.hashtags||[]).map(x=>'#'+x).join(' '))}</p><p>${esc(n?.novelInfo?.catchCopy||n?.summary||'')}</p><button class="btn" type="button">${isDraft?'管理ページを開く':'作品を見る'}</button></div>`;d.querySelector('button').onclick=()=>location.href='novel.html?account='+encodeURIComponent(aid);return d}
function render(){const a=active();const displayName=a?.name||profile.name||'ゲスト';$('name').textContent=displayName;$('avatar').innerHTML=profile.icon?`<img src="${profile.icon}">`:(displayName[0]||'G');$('avatar').innerHTML+=crown(type(a));$('badge').innerHTML=type(a)?`<span class="badge ${type(a)==='operator'?'operator':'author'}">${type(a)==='operator'?'運営公式':'公式作者'}</span>`:'';$('cover').style.backgroundImage=profile.background?`url(${profile.background})`:'';$('bio').textContent=profile.bio;$('bio').style.fontSize=profile.bioSize;$('bio').style.textAlign=profile.bioAlign;$('bio').style.color=profile.bioColor;$('bio').style.background=profile.bioBg;const n=novel();$('published').innerHTML='';$('drafts').innerHTML='';if(!n){$('published').innerHTML='<p class="empty">公開中の小説はありません。</p>';$('drafts').innerHTML='<p class="empty">保存した小説はありません。</p>'}else{const pub=n.visibility==='public';(pub?$('published'):$('drafts')).appendChild(workCard(n,!pub));}const count=n?1:0;$('novelCount').textContent=count;$('favoriteCount').textContent=profile.favoriteCount||0;$('following').textContent=profile.following||0;$('followers').textContent=profile.followers||0}
function openEditor(){ $('editName').value=profile.name;$('editBio').value=profile.bio;$('bioSize').value=profile.bioSize;$('bioAlign').value=profile.bioAlign;$('bioColor').value=profile.bioColor;$('bioBg').value=profile.bioBg;$('editor').classList.add('open');preview()}function preview(){const p=$('bioPreview');p.textContent=$('editBio').value||'プロフィール文のプレビュー';p.style.fontSize=$('bioSize').value;p.style.textAlign=$('bioAlign').value;p.style.color=$('bioColor').value;p.style.background=$('bioBg').value;p.style.fontWeight=$('bold')?.checked?'bold':'normal'}$('editButton').style.display=isOwner?'inline-block':'none';if(!isOwner){$('editor').remove();$('drafts').parentElement.style.display='none'}$('editButton').onclick=openEditor;$('cancelEdit').onclick=()=>{$('editor').classList.remove('open')};['editBio','bioSize','bioAlign','bioColor','bioBg'].forEach(id=>$(id).addEventListener('input',preview));document.querySelectorAll('.line').forEach(x=>x.onclick=()=>{$('editBio').value+=($('editBio').value?'\n':'')+x.dataset.line;preview()});$('saveProfile').onclick=async()=>{profile.name=$('editName').value.trim()||'ゲスト';profile.bio=$('editBio').value;profile.bioSize=$('bioSize').value;profile.bioAlign=$('bioAlign').value;profile.bioColor=$('bioColor').value;profile.bioBg=$('bioBg').value;const i=$('iconInput').files[0],b=$('bgInput').files[0];if(i)profile.icon=await imageRead(i);if(b)profile.background=await imageRead(b);localStorage.setItem(profileKey,JSON.stringify(profile));$('message').textContent='プロフィールを保存しました';render()};render();
</script></body></html>
