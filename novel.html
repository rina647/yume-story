<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品詳細・管理｜YUME WORLD</title><style>
*{box-sizing:border-box}body{margin:0;color:#625665;font-family:"Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff7fb,#f4f0ff)}.page{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{display:inline-block;border:0;border-radius:22px;padding:10px 16px;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:#fff;text-decoration:none;cursor:pointer;font:inherit}.btn.light{background:#eee4f5;color:#85678d}.btn.danger{background:#f4dfe8;color:#a36b86}.hero,.card{background:#fffffff5;border-radius:24px;box-shadow:0 8px 28px #ae86ae1c;margin-top:18px;padding:24px}.hero{display:grid;grid-template-columns:200px 1fr;gap:25px;align-items:center}.cover{height:265px;border-radius:18px;background:linear-gradient(135deg,#d99bc0,#bca9e8);display:grid;place-items:center;color:#fff;font-weight:bold;text-align:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.state{display:inline-block;border-radius:18px;padding:6px 12px;background:#eee4f5;color:#85678d;font-size:.9rem}.state.public{background:#e3f4ed;color:#4c916f}.state.limited{background:#fff0cd;color:#a97a2a}h1{margin:12px 0 5px;color:#a56f93}h2{margin:0 0 16px;color:#aa7298;border-left:5px solid #dca6c7;padding-left:10px}.meta{color:#968497}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ead9e3;border-radius:15px;overflow:hidden;margin-top:18px}.stat{background:#fff;padding:13px;text-align:center}.stat strong{display:block;color:#b8759c;font-size:1.3rem}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.info-item{padding:13px;border-radius:14px;background:#fff8fc}.info-item b{display:block;color:#a56f93;margin-bottom:5px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#f8e4ef;color:#a26c91;border-radius:17px;padding:5px 10px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions .btn{text-align:center;padding:15px}.chapter{border:1px solid #ead9e3;border-radius:16px;padding:14px;margin:10px 0;background:#fffafd}.chapter-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.chapter h3{margin:0;color:#9d6c8f}.chapter textarea{width:100%;min-height:100px;margin-top:10px;border:1px solid #ead9e3;border-radius:12px;padding:10px;font:inherit}.chapter-actions{margin-top:8px}.add-row{display:flex;gap:8px}.add-row input{flex:1;border:1px solid #ead9e3;border-radius:12px;padding:11px;font:inherit}.character{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0e2ea;padding:9px}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#eadcf7;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.message{color:#a26c91;min-height:22px}@media(max-width:650px){.page{padding:10px}.hero{grid-template-columns:1fr;gap:15px}.cover{height:220px;max-width:180px}.info-grid,.actions{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top h2{font-size:18px}.chapter-head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="page"><div class="top"><h2>📚 作品詳細・管理</h2><a href="mypage.html" class="btn light">マイページへ</a></div><div id="blocked" class="card" hidden><h2>閲覧できません</h2><p>この作品は非公開です。作者本人のみ管理できます。</p></div><section id="content"><section class="hero"><div id="cover" class="cover">YUME<br>WORLD</div><div><span id="state" class="state">非公開</span><h1 id="title">無題の小説</h1><p class="meta">作者：<strong id="author">ゲスト</strong></p><div class="stats"><div class="stat"><strong id="views">0</strong>閲覧数</div><div class="stat"><strong id="favorites">0</strong>お気に入り</div><div class="stat"><strong id="stars">0</strong>評価</div><div class="stat"><strong id="follows">0</strong>フォロー</div></div></div></section><section class="card"><h2>作品紹介</h2><div class="info-grid"><div class="info-item"><b>ジャンル</b><span id="genre">その他</span></div><div class="info-item"><b>セルフレイティング</b><span id="rating">全年齢</span></div><div class="info-item"><b>キャッチコピー</b><span id="catch"></span></div><div class="info-item"><b>オリジナル小説</b><span id="original"></span></div></div><div class="info-item" style="margin-top:15px"><b>あらすじ</b><div id="summary" style="white-space:pre-wrap"></div></div><div id="tags" class="tags" style="margin-top:15px"></div></section><section id="manage" class="card"><h2>管理メニュー</h2><div class="actions"><a class="btn" id="edit" href="write.html">小説の編集</a><button class="btn" id="newChapter">チャプター作成</button><button class="btn" id="characterManage">キャラクター管理</button></div><p id="message" class="message"></p></section><section class="card"><h2>本文・チャプター</h2><div id="chapters"></div><div id="chapterForm" hidden><div class="add-row"><input id="chapterTitle" placeholder="例：第1話「はじめまして」"><button class="btn" id="addChapter">追加</button></div></div></section><section id="charactersCard" class="card" hidden><h2>キャラクター管理</h2><div id="characters"></div><div class="add-row"><input id="characterName" placeholder="キャラクター名"><button class="btn" id="addCharacter">登録</button></div></section></section></main><script>
const BASE='yumeWorldNovelV3',ACTIVE='yumeWorldActiveAccount',ACCOUNTS='yumeWorldAccountsV1',$=id=>document.getElementById(id),viewer=localStorage.getItem(ACTIVE)||'guest',requested=new URLSearchParams(location.search).get('account'),owner=requested?requested===viewer:true,aid=requested||viewer,KEY=aid==='guest'?BASE:BASE+':'+aid;let data={title:'',summary:'',cover:'',novelInfo:{genre:'その他',catchCopy:'',hashtags:[],selfRating:'全年齢',original:false},visibility:'private',chapters:[],characters:[]};function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){data=Object.assign(data,x);data.novelInfo=Object.assign({genre:'その他',catchCopy:'',hashtags:[],selfRating:'全年齢',original:false},x.novelInfo||{});data.chapters=x.chapters||[];data.characters=x.characters||[]}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}function account(){try{return JSON.parse(localStorage.getItem(ACCOUNTS)||'[]').find(x=>x.id===aid)}catch(e){return null}}function render(){const publicWork=data.visibility==='public';if(!owner&&!publicWork){$('content').hidden=true;$('blocked').hidden=false;return}const a=account();$('title').textContent=data.title||'無題の小説';$('author').textContent=a?.name||'ゲスト';$('summary').textContent=data.summary||'あらすじはまだありません。';$('genre').textContent=data.novelInfo.genre||'その他';$('catch').textContent=data.novelInfo.catchCopy||'—';$('rating').textContent=data.novelInfo.selfRating||'全年齢';$('original').textContent=data.novelInfo.original?'オリジナル':'二次創作・未設定';$('tags').innerHTML=(data.novelInfo.hashtags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('');const st=data.visibility==='public'?'公開中':data.visibility==='limited'?'限定公開':'非公開';$('state').textContent=st;$('state').className='state '+data.visibility;$('cover').innerHTML=data.cover?`<img src="${data.cover}" alt="表紙">`:'YUME<br>WORLD';$('manage').hidden=!owner;$('chapters').innerHTML='';if(!data.chapters.length)$('chapters').innerHTML='<p class="meta">チャプターはまだありません。</p>';data.chapters.forEach((c,i)=>{const el=document.createElement('article');el.className='chapter';el.innerHTML=`<div class="chapter-head"><h3>${esc(c.title||'第'+(i+1)+'話')}</h3><span class="meta">第${i+1}章</span></div>${owner?`<textarea>${esc(c.body||'')}</textarea><div class="chapter-actions"><button class="btn light save-chapter">本文を保存</button> <button class="btn light up">↑</button> <button class="btn light down">↓</button> <button class="btn danger del">削除</button></div>`:`<p style="white-space:pre-wrap">${esc(c.body||'')}</p>`}`;if(owner){el.querySelector('.save-chapter').onclick=()=>{c.body=el.querySelector('textarea').value;save();msg('チャプター本文を保存しました')};el.querySelector('.del').onclick=()=>{if(confirm('このチャプターを削除しますか？')){data.chapters.splice(i,1);save();render()}};el.querySelector('.up').onclick=()=>{if(i){[data.chapters[i-1],data.chapters[i]]=[data.chapters[i],data.chapters[i-1]];save();render()}};el.querySelector('.down').onclick=()=>{if(i<data.chapters.length-1){[data.chapters[i+1],data.chapters[i]]=[data.chapters[i],data.chapters[i+1]];save();render()}}} $('chapters').append(el)});renderCharacters()}function renderCharacters(){if(!owner)return;$('characters').innerHTML=data.characters.length?data.characters.map((c,i)=>`<div class="character"><div class="avatar">${c.icons?.[0]||c.icon?`<img src="${c.icons?.[0]||c.icon}">`:'👤'}</div><strong>${esc(c.name)}</strong><button class="btn danger" data-i="${i}" style="margin-left:auto">削除</button></div>`).join(''):'<p class="meta">登録キャラクターはありません。</p>';$('characters').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{data.characters.splice(+b.dataset.i,1);save();render()})}function msg(t){$('message').textContent=t;setTimeout(()=>$('message').textContent='',2500)}$('newChapter').onclick=()=>{$('chapterForm').hidden=!$('chapterForm').hidden};$('addChapter').onclick=()=>{const t=$('chapterTitle').value.trim();if(!t)return;data.chapters.push({id:'ch-'+Date.now(),title:t,body:''});save();$('chapterTitle').value='';$('chapterForm').hidden=true;render()};$('characterManage').onclick=()=>{$('charactersCard').hidden=!$('charactersCard').hidden};$('addCharacter').onclick=()=>{const name=$('characterName').value.trim();if(!name)return;data.characters.push({id:'c-'+Date.now(),name,icons:[],side:'left',color:'#f8d8e8',shape:'standard',pattern:'plain'});save();$('characterName').value='';render()};read();if(!owner)$('edit').remove();render();
</script></body></html>
