<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品を読む｜YUME WORLD</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#625665;font-family:"Yu Gothic",sans-serif;background:linear-gradient(135deg,#fff7fb,#f2f1ff)}.page{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:22px;padding:10px 16px;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:#fff;text-decoration:none;cursor:pointer;font:inherit}.btn.light{background:#eee5f4;color:#876c90}.btn.active{background:linear-gradient(135deg,#ee8fb0,#d878ad)}.btn:active{transform:scale(.96)}#favorite.active,#like.active{animation:heartPop .28s ease}@keyframes heartPop{50%{transform:scale(1.12)}100%{transform:scale(1)}}h1,h2{color:#a56f93}h1{margin:8px 0}.card,.hero,.reader{background:#fffffff2;border-radius:24px;box-shadow:0 8px 28px #ae86ae1c;margin-top:16px;padding:22px}.hero{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}.cover{height:245px;border-radius:18px;background:linear-gradient(135deg,#d99bc0,#bca9e8);display:grid;place-items:center;color:#fff;font-weight:bold;text-align:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.meta{color:#968497}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{background:#f8e4ef;color:#a26c91;border-radius:17px;padding:5px 10px}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.stat{background:#fff3fa;border-radius:16px;padding:8px 13px;color:#966b87}.stat b{color:#ba7099}.actions{display:flex;gap:9px;flex-wrap:wrap}.intro{white-space:pre-wrap;line-height:1.8}.chapter-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}.chapter-nav button{white-space:nowrap}.reader{min-height:180px;line-height:1.9}.reader-title{border-bottom:1px solid #ead9e3;padding-bottom:12px}.text{white-space:pre-wrap;margin:18px 0}.message{font-size:.83em;color:#9e8198;white-space:pre-wrap;margin:15px 0}.bubble-row{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.bubble-row.right{flex-direction:row-reverse}.bubble-icon{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#eadcf7;display:grid;place-items:center;flex:none}.bubble-icon img{width:100%;height:100%;object-fit:cover}.bubble-name{font-size:.78em;color:#a17493;margin-bottom:3px}.bubble{padding:11px 15px;border-radius:18px;white-space:pre-wrap;max-width:min(620px,72vw);color:#685669;box-shadow:0 3px 10px #c997b522}.bubble.heart{border-radius:48% 48% 45% 45%}.bubble.round{border-radius:30px}.bubble.cloud{border-radius:28px 28px 24px 10px}.bubble.ribbon{border-radius:5px 22px}.bubble.crystal{transform:skew(-2deg);border-radius:8px}.bubble.drop{border-radius:24px 24px 24px 5px}.bubble.square{border-radius:5px}.pattern-dots{background-image:radial-gradient(#ffffff80 1px,transparent 1px)!important;background-size:9px 9px}.pattern-stripes{background-image:repeating-linear-gradient(45deg,#ffffff33 0 4px,transparent 4px 9px)!important}.pattern-check{background-image:linear-gradient(45deg,#ffffff30 25%,transparent 25%,transparent 75%,#ffffff30 75%),linear-gradient(45deg,#ffffff30 25%,transparent 25%,transparent 75%,#ffffff30 75%)!important;background-size:12px 12px;background-position:0 0,6px 6px}.art{text-align:left;margin:18px 0}.art.right{text-align:right}.art img{max-width:100%;max-height:460px;border-radius:14px}.art.stamp img{width:130px;max-height:130px;object-fit:contain}.poll,.call,.novel-link{background:#fff3fa;border:1px solid #ead9e3;border-radius:16px;padding:14px;margin:18px 0}.poll label{display:block;margin:8px}.deco{text-align:center;color:#b8759c;margin:22px}.comment{border-top:1px solid #f0e2ea;padding:13px 0}.comment-head{display:flex;align-items:center;gap:8px}.comment-icon{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#eadcf7;display:grid;place-items:center}.comment-icon img{width:100%;height:100%;object-fit:cover}.comment-body{white-space:pre-wrap;margin:7px 0 0 38px}.story-link{color:#a56f93;font-weight:bold;text-decoration:underline;text-decoration-color:#e6b4d0;text-underline-offset:3px}.comment-form textarea{width:100%;min-height:75px;border:1px solid #ead9e3;border-radius:12px;padding:10px;font:inherit}.notice{background:#fff0f6;border-radius:15px;padding:15px;color:#9b6d88}.hidden{display:none}@media(max-width:650px){.page{padding:10px}.hero{grid-template-columns:1fr}.cover{height:210px;max-width:180px}.top{align-items:flex-start}.top h2{font-size:18px}.bubble{max-width:70vw}}
</style></head>
<body><main class="page">
<div class="top"><h2>📖 YUME WORLD</h2><a class="btn light" href="index.html">ホーム</a></div>
<div id="blocked" class="card notice hidden"></div>
<div id="app" class="hidden">
<section class="hero"><div id="cover" class="cover">YUME<br>WORLD</div><div><span id="state" class="meta"></span><h1 id="title"></h1><p class="meta">作者：<strong id="author"></strong></p><p id="catch" class="meta"></p><div class="stats"><span class="stat">👁 <b id="views">0</b> 閲覧</span><span class="stat">♡ <b id="favorites">0</b> お気に入り</span></div><div class="actions"><button id="favorite" class="btn">♡ お気に入り</button><button id="share" class="btn light">✧ 共有</button></div></div></section>
<section class="card"><h2>作品紹介</h2><p><b id="genre"></b>　<span id="rating"></span>　<span id="original"></span></p><p id="summary" class="intro"></p><div id="tags" class="tags"></div></section>
<section class="card"><h2>チャプター</h2><div id="chapterNav" class="chapter-nav"></div><div id="reader" class="reader"></div><div class="actions"><button id="prev" class="btn light">← 前の話</button><button id="next" class="btn light">次の話 →</button></div></section>
<section class="card"><h2>共有</h2><div id="shareBox" class="notice hidden"><p id="shareTitle"></p><input id="shareUrl" readonly style="width:100%;padding:10px;border:1px solid #ead9e3;border-radius:10px"><button id="copy" class="btn" style="margin-top:8px">リンクをコピー</button><span id="copyMessage"></span></div></section>
</div></main>
<script>
const BASE='yumeWorldNovelV3',ACTIVE='yumeWorldActiveAccount',ACCOUNTS='yumeWorldAccountsV1',$=id=>document.getElementById(id),params=new URLSearchParams(location.search),aid=params.get('account')||'guest',viewer=localStorage.getItem(ACTIVE)||'guest',KEY=aid==='guest'?BASE:BASE+':'+aid;let data={title:'',summary:'',cover:'',visibility:'private',novelInfo:{},chapters:[]},publicChapters=[],selected=0;
function esc(x){const d=document.createElement('div');d.textContent=x==null?'':String(x);return d.innerHTML}function accounts(){try{return JSON.parse(localStorage.getItem(ACCOUNTS)||'[]')}catch(e){return[]}}function author(){return accounts().find(x=>x.id===aid)?.name||'ゲスト'}function profile(id){try{return JSON.parse(localStorage.getItem('yumeWorldProfileV1:'+id)||'{}')}catch(e){return{}}}function load(){try{data=Object.assign(data,JSON.parse(localStorage.getItem(KEY)||'{}'));data.novelInfo=Object.assign({},data.novelInfo||{});data.chapters=data.chapters||[]}catch(e){}}
function novelUrl(raw){try{const u=new URL(raw,location.href);const account=u.searchParams.get('account');if(account&&(/(?:reader|novel)\.html$/.test(u.pathname)||u.pathname===location.pathname))return 'reader.html?account='+encodeURIComponent(account);return raw}catch(e){return raw}}
function linkedText(text){let safe=esc(text||'');const re=/(https?:\/\/[^\s<]+|(?:reader|novel)\.html\?account=[^\s<]+)/g;return safe.replace(re,m=>`<a class="story-link" href="${esc(novelUrl(m))}">${m}</a>`)}function stats(){data.readStats=data.readStats||{views:0,favorites:{}};data.readStats.favorites=data.readStats.favorites||{}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function logged(){return viewer!=='guest'&&accounts().some(x=>x.id===viewer)}
function updateShelf(kind){if(viewer==='guest')return;let s;try{s=JSON.parse(localStorage.getItem('yumeWorldBookshelfV1:'+viewer)||'{\"recent\":{},\"favorites\":{}}')}catch(e){s={recent:{},favorites:{}}}s.recent=s.recent||{};s.favorites=s.favorites||{};const old=s.recent[aid]||{};const item={owner:aid,title:data.title,cover:data.cover||'',genre:data.novelInfo?.genre||'その他',catchCopy:data.novelInfo?.catchCopy||'',lastRead:Date.now(),lastChapter:old.lastChapter||0};if(kind==='recent')s.recent[aid]=item;if(kind==='favorite'){if(data.readStats.favorites[viewer])s.favorites[aid]=item;else delete s.favorites[aid]}localStorage.setItem('yumeWorldBookshelfV1:'+viewer,JSON.stringify(s))}function countViews(){stats();updateShelf('recent');const k='yume-view:'+aid+':'+(data.title||'');const last=+sessionStorage.getItem(k)||0;if(Date.now()-last>10*60*1000){data.readStats.views++;sessionStorage.setItem(k,String(Date.now()));save()}}
function render(){stats();$('cover').innerHTML=data.cover?`<img src="${data.cover}" alt="表紙">`:'YUME<br>WORLD';$('title').textContent=data.title||'無題の小説';$('author').textContent=author();$('state').textContent=data.visibility==='limited'?'限定公開':'公開中';$('catch').textContent=data.novelInfo.catchCopy||'';$('genre').textContent=data.novelInfo.genre||'その他';$('rating').textContent=data.novelInfo.selfRating||'全年齢';$('original').textContent=data.novelInfo.original?'🌟 オリジナル':'';$('summary').textContent=data.summary||'あらすじはまだありません。';$('tags').innerHTML=(data.novelInfo.hashtags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('');$('views').textContent=data.readStats.views||0;$('favorites').textContent=Object.keys(data.readStats.favorites).length;$('favorite').textContent=data.readStats.favorites[viewer]?'♥ お気に入り済み':'♡ お気に入り';$('favorite').classList.toggle('active',!!data.readStats.favorites[viewer]);$('chapterNav').innerHTML='';publicChapters.forEach((c,i)=>{const b=document.createElement('button');b.className='btn light'+(i===selected?' active':'');b.textContent=c.title||`第${i+1}話`;b.onclick=()=>{selected=i;renderChapter()};$('chapterNav').append(b)});renderChapter()}
function renderChapter(){if(viewer!=='guest'){try{const s=JSON.parse(localStorage.getItem('yumeWorldBookshelfV1:'+viewer)||'{\"recent\":{}}');if(s.recent?.[aid]?.lastChapter!=null&&selected===0)selected=Math.min(+s.recent[aid].lastChapter,Math.max(0,publicChapters.length-1));s.recent=s.recent||{};if(s.recent[aid]){s.recent[aid].lastChapter=selected;s.recent[aid].lastRead=Date.now();localStorage.setItem('yumeWorldBookshelfV1:'+viewer,JSON.stringify(s))}}catch(e){}}const c=publicChapters[selected];if(!c){$('reader').innerHTML='<p class="meta">公開されたチャプターはまだありません。</p>';return}$('reader').innerHTML=`<h2 class="reader-title">${esc(c.title||`第${selected+1}話`)}</h2>`+(c.blocks?.length?c.blocks.map((b,i)=>block(b,i)).join(''):`<div class="text">${esc(c.body||'')}</div>`)+`<div class="actions"><button id="like" class="btn ${c.likes?.[viewer]?'active':''}">${c.likes?.[viewer]?'♥ いいね済み':'♡ いいね'} <small>${c.likes?Object.keys(c.likes).length:0}</small></button></div><div id="comments"><h3>コメント</h3>${comments(c)}</div><div class="comment-form">${logged()?'<textarea id="commentText" placeholder="コメントを書く"></textarea><button id="commentSend" class="btn" style="margin-top:8px">コメントする</button>':'<p class="meta">コメントするにはログインしてください。</p>'}</div>`;const like=$('like');if(like)like.onclick=()=>{if(!logged()){alert('ログインするといいねできます');return}c.likes=c.likes||{};c.likes[viewer]?delete c.likes[viewer]:c.likes[viewer]=true;save();renderChapter()};const send=$('commentSend');if(send)send.onclick=()=>{const text=$('commentText').value.trim();if(!text)return;c.comments=c.comments||[];c.comments.push({id:'comment-'+Date.now(),aid:viewer,text,at:new Date().toISOString()});save();renderChapter()};document.querySelectorAll('.edit-comment').forEach(btn=>btn.onclick=()=>{const x=(c.comments||[]).find(x=>x.id===btn.dataset.id);const t=prompt('コメントを編集',x?.text||'');if(t!==null&&t.trim()){x.text=t.trim();save();renderChapter()}});document.querySelectorAll('.delete-comment').forEach(btn=>btn.onclick=()=>{c.comments=(c.comments||[]).filter(x=>x.id!==btn.dataset.id);save();renderChapter()});$('prev').disabled=selected<=0;$('next').disabled=selected>=publicChapters.length-1;$('prev').onclick=()=>{if(selected>0){selected--;render()}};$('next').onclick=()=>{if(selected<publicChapters.length-1){selected++;render()}}}
function comments(c){return (c.comments||[]).map(x=>{const p=profile(x.aid),name=accounts().find(a=>a.id===x.aid)?.name||'ユーザー';return `<div class="comment"><div class="comment-head"><span class="comment-icon">${p.icon?`<img src="${p.icon}">`:'♡'}</span><b>${esc(name)}</b><small class="meta">${new Date(x.at).toLocaleString('ja-JP')}</small></div><div class="comment-body">${esc(x.text)}</div>${(x.aid===viewer||viewer===aid)?`<button class="btn light edit-comment" data-id="${esc(x.id)}">編集</button> <button class="btn light delete-comment" data-id="${esc(x.id)}">削除</button>`:''}</div>`}).join('')||'<p class="meta">まだコメントはありません。</p>'}
function block(b,i){if(b.type==='speech')return `<div class="bubble-row ${b.side==='right'?'right':''}"><div class="bubble-icon">${b.icon?`<img src="${b.icon}">`:'👤'}</div><div><div class="bubble-name">${esc(b.name)}</div><div class="bubble ${esc(b.shape||'standard')} pattern-${esc(b.pattern||'plain')}" style="background-color:${esc(b.color||'#f8d8e8')}">${linkedText((b.text||'').replaceAll('{{夢主}}','{{夢主}}'))}</div>${b.read?'<small class="meta">既読</small>':''}</div></div>`;if(b.type==='message')return `<div class="message">${linkedText(b.text)}</div>`;if(b.type==='image'||b.type==='stamp')return `<div class="art ${b.side==='right'?'right':''} ${b.type==='stamp'?'stamp':''}"><img src="${esc(b.src)}"></div>`;if(b.type==='poll')return `<div class="poll"><b>アンケート</b><p>${esc(b.question)}</p>${(b.options||[]).map(x=>`<label><input type="radio" name="poll-${i}"> ${esc(x)}</label>`).join('')}</div>`;if(b.type==='link')return `<div class="novel-link">🔗 <a href="${esc(novelUrl(b.url||'#'))}">${esc(b.label||'作品を読む')}</a></div>`;if(b.type==='call')return `<div class="call">☎ 通話終了　${esc(b.time||'通話時間')}</div>`;if(b.type==='deco')return `<div class="deco">${esc(b.value)}</div>`;return `<div class="text">${linkedText(b.text||'')}</div>`}
$('favorite').onclick=()=>{if(!logged()){alert('ログインするとお気に入り登録できます');return}stats();data.readStats.favorites[viewer]?delete data.readStats.favorites[viewer]:data.readStats.favorites[viewer]=true;save();updateShelf('favorite');render()};$('share').onclick=()=>{$('shareBox').classList.toggle('hidden');$('shareTitle').textContent=data.title||'作品URL';$('shareUrl').value=location.href};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('shareUrl').value);$('copyMessage').textContent=' コピーしました'}catch(e){$('shareUrl').select();document.execCommand('copy');$('copyMessage').textContent=' コピーしました'}};
load();const owner=viewer===aid;const accessible=data.visibility==='public'||owner;if(!accessible){$('blocked').textContent='この作品は公開されていません。';$('blocked').classList.remove('hidden')}else{$('app').classList.remove('hidden');publicChapters=data.chapters.filter(c=>c.status==='public');countViews();render()}
</script></body></html>
