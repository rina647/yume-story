<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品を探す｜YUME WORLD</title><style>*{box-sizing:border-box}body{margin:0;color:#625665;font-family:"Yu Gothic",sans-serif;background-color:#fffafd;background-image:url('yume-world-search-horizontal-a.png');background-position:center top;background-size:cover;background-repeat:no-repeat;background-attachment:fixed}.page{max-width:1000px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:22px;padding:10px 16px;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:#fff;text-decoration:none;cursor:pointer;font:inherit}.btn.light{background:#eee5f4;color:#876c90}.search{background:rgba(255,250,253,.62);border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 8px 28px #ae86ae1c}.form{display:flex;gap:9px}.form input,.form select{flex:1;min-width:0;padding:13px 15px;border:1px solid #ead9e3;border-radius:18px;background:rgba(255,255,255,.72);font:inherit}.form select{flex:0 0 130px}.hint{color:#9a8393;font-size:.9rem}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px;margin-top:18px}.work{display:flex;gap:13px;padding:13px;border-radius:17px;background:rgba(255,255,255,.66);border:1px solid #ead9e3;cursor:pointer}.work:hover{transform:translateY(-2px);box-shadow:0 5px 15px #c997b533}.cover{width:88px;height:120px;flex:none;border-radius:10px;background:linear-gradient(135deg,#d99bc0,#bca9e8);display:grid;place-items:center;color:#fff;font-weight:bold;text-align:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.work h3{margin:3px 0;color:#a56f93}.work p{margin:5px 0;font-size:.84rem;line-height:1.4}.tag{display:inline-block;background:#f8e4ef;color:#a26c91;border-radius:13px;padding:3px 7px;margin:2px}.empty{text-align:center;padding:35px;color:#a58b9d}@media(max-width:600px){.page{padding:10px}.form{flex-wrap:wrap}.form input{flex-basis:100%}.form select,.form button{flex:1}.results{grid-template-columns:1fr}}
.lumi-page-art{max-width:1000px;margin:14px auto 0;padding:0 16px;position:relative;z-index:0}.lumi-page-art__inner{position:relative;min-height:118px;overflow:hidden;border:1px solid #eadcf3;border-radius:24px;background:linear-gradient(105deg,#f4f2ff,#fff7fb 58%,#f0f8ff);box-shadow:0 8px 25px #ae86ae18}.lumi-page-art img{position:absolute;right:0;top:-18px;width:54%;height:160px;object-fit:cover;object-position:center 40%;mix-blend-mode:multiply;opacity:.92}.lumi-page-art__copy{position:relative;z-index:1;width:52%;padding:29px 25px;color:#98749a;font-size:clamp(15px,2vw,21px);font-weight:700;letter-spacing:.04em}.lumi-page-art__copy::before{content:'✦';display:block;margin-bottom:4px;color:#dba5c5;font-size:16px}.lumi-page-art--reader .lumi-page-art__inner{background:linear-gradient(105deg,#f2f6ff,#fffafe)}.lumi-page-art--write .lumi-page-art__inner{background:linear-gradient(105deg,#fff7fc,#f0f6ff)}@media(max-width:650px){.lumi-page-art{padding:0 10px;margin-top:10px}.lumi-page-art__inner{min-height:95px;border-radius:18px}.lumi-page-art img{top:-5px;width:58%;height:110px;opacity:.78}.lumi-page-art__copy{width:58%;padding:22px 15px;font-size:14px}.lumi-page-art__copy::before{font-size:13px}}
</style></head><body><section class="lumi-page-art lumi-page-art--search" aria-label="ルミの案内"><div class="lumi-page-art__inner"><img src="lumi-search.png" alt="ルミ：どんな物語を探す？"><div class="lumi-page-art__copy">どんな物語を探す？</div></div></section><main class="page"><div class="top"><h1>🔍 作品を探す</h1><a class="btn light" href="index.html">🏠 ホーム</a></div><section class="search"><div class="form"><input id="query" autofocus placeholder="タイトル・作者・タグ・ジャンルで検索"><select id="scope"><option value="all">すべて</option><option value="title">タイトル</option><option value="author">作者</option><option value="tag">タグ</option><option value="genre">ジャンル</option></select><button id="go" class="btn">検索</button></div><p class="hint">#恋愛 のように入力しても、恋愛だけで入力しても検索できます。</p></section><p id="summary" class="hint"></p><section id="results" class="results"></section></main><script>const $=id=>document.getElementById(id),BASE='yumeWorldNovelV3',ACCOUNT='yumeWorldAccountsV1';let works=[];function esc(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}function accounts(){try{return JSON.parse(localStorage.getItem(ACCOUNT)||'[]')}catch(e){return[]}}function load(){const list=[{id:'guest',name:'ゲスト'},...accounts()];const seen=new Set;works=[];list.forEach(a=>{if(seen.has(a.id))return;seen.add(a.id);try{const n=JSON.parse(localStorage.getItem(a.id==='guest'?BASE:BASE+':'+a.id)||'null');if(n&&n.visibility==='public')works.push({owner:a.id,author:a.name||'ゲスト',n})}catch(e){}})}function hay(w,scope){const n=w.n,info=n.novelInfo||{},tags=info.hashtags||[];return {title:n.title||'',author:w.author,tag:tags.join(' '),genre:info.genre||'',all:[n.title,w.author,tags.join(' '),info.genre,info.catchCopy,n.summary].join(' ')}[scope]}function render(){const q=$('query').value.trim().toLowerCase().replace(/^#/,'');const scope=$('scope').value;const found=works.filter(w=>!q||hay(w,scope).toLowerCase().includes(q)||(scope==='tag'&&((w.n.novelInfo?.hashtags||[]).some(t=>t.toLowerCase().replace(/^#/,'').includes(q)))));$('summary').textContent=q?found.length+'件の作品':'公開中の作品 '+found.length+'件';$('results').innerHTML='';if(!found.length){$('results').innerHTML='<div class="empty">該当する作品が見つかりませんでした。</div>';return}found.forEach(w=>{const n=w.n,info=n.novelInfo||{},el=document.createElement('article');el.className='work';el.innerHTML='<div class="cover">'+(n.cover?'<img src="'+n.cover+'" alt="表紙">':'YUME<br>WORLD')+'</div><div><h3>'+esc(n.title||'無題の小説')+'</h3><p>作者：'+esc(w.author)+'</p><p>'+esc(info.genre||'その他')+'</p><p>'+esc(info.catchCopy||n.summary||'')+'</p><div>'+(info.hashtags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div><p class="hint">👁 '+(n.readStats?.views||0)+'　♡ '+Object.keys(n.readStats?.favorites||{}).length+'</p></div>';el.onclick=()=>location.href='reader.html?account='+encodeURIComponent(w.owner);$('results').append(el)})}$('go').onclick=render;$('query').oninput=render;$('scope').onchange=render;load();render();</script></body></html>
