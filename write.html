<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小説を書く｜YUME WORLD</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fff8fc;color:#555}header{background:linear-gradient(135deg,#f7c9df,#dcd0ff);color:white;padding:25px;text-align:center}header h1{margin:0;font-size:25px}.container{max-width:1000px;margin:30px auto;padding:20px}.card{background:white;padding:25px;margin-bottom:20px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.06)}h2{color:#bd79a2;border-left:5px solid #dca6c7;padding-left:10px}input,textarea,select{width:100%;padding:12px;margin-top:7px;border:1px solid #ead9e3;border-radius:12px;background:#fffafd;font-size:14px}textarea{min-height:100px}button{border:none;padding:11px 18px;margin:5px;border-radius:20px;cursor:pointer;background:linear-gradient(135deg,#d99bc0,#bca9e8);color:white;font-size:14px}button:hover{opacity:.85}.secondary{background:#eadcf7;color:#8f6b94}.danger{background:#ddd;color:#666;font-size:12px}.editor{background:#faf7ff;padding:20px;border-radius:15px;min-height:200px}.text-block{background:white;padding:15px;margin:12px 0;border-radius:12px;border:1px solid #ead9e3}.speech-block{display:flex;gap:10px;align-items:flex-start;margin:15px 0}.speech-block.right{flex-direction:row-reverse}.icon{width:50px;height:50px;border-radius:50%;background:#eadcf7;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}.icon img,.character-icon{width:50px;height:50px;border-radius:50%;object-fit:cover}.speech{padding:13px 18px;border-radius:20px;background:#f8d8e8;max-width:75%;word-break:break-word}.right .speech{text-align:right}.preview{background:#fff;padding:20px;border-radius:15px;min-height:200px;border:1px solid #eee}.character-form{background:#fffafd;border:1px solid #ead9e3;border-radius:15px;padding:18px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.character-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:15px 0}.character-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ead9e3;border-radius:14px;background:#fff}.character-item.selected{border:2px solid #d99bc0;background:#fff5fb}.character-item button{padding:7px 10px;font-size:12px;margin-left:auto}.character-meta{flex:1;min-width:0}.character-meta strong{display:block}.character-meta small{color:#999}.help{font-size:12px;color:#999;line-height:1.7}.choice{display:flex;gap:14px;margin-top:7px}.choice label{display:flex;align-items:center;gap:4px}.choice input{width:auto;margin:0}.speech-editor{flex:1}.status{font-size:13px;color:#a26c91;min-height:20px}@media(max-width:600px){.field-row{grid-template-columns:1fr}.container{padding:10px}.card{padding:18px}.speech{max-width:78%}}
</style>
</head>
<body>
<header><h1>✏️ 小説を書く</h1><p>YUME WORLD</p></header>
<div class="container">
<div class="card"><h2>📖 小説情報</h2><label>小説タイトル</label><input id="title" type="text" placeholder="小説のタイトル"><label>あらすじ</label><textarea id="summary" placeholder="小説のあらすじ"></textarea></div>
<div class="card"><h2>📚 チャプター</h2><label>チャプタータイトル</label><input id="chapterTitle" type="text" placeholder="第1話「はじまり」"></div>
<div class="card"><h2>👥 キャラクター管理</h2><p class="help">登録したキャラクターはこのブラウザに保存され、ページを更新しても残ります。本文で使用中の吹き出しは、キャラクターを削除してもそのまま残ります。</p>
<div class="character-form"><div class="field-row"><div><label>キャラクター名</label><input id="characterName" type="text" placeholder="例：ゆみり"></div><div><label>アイコン画像</label><input id="characterIcon" type="file" accept="image/*"></div></div><div class="field-row"><div><label>吹き出しの向き</label><div class="choice"><label><input type="radio" name="characterSide" value="left" checked> 左</label><label><input type="radio" name="characterSide" value="right"> 右</label></div></div><div><label>吹き出しの色</label><input id="characterColor" type="color" value="#f8d8e8"></div></div><button id="saveCharacterButton" type="button">＋ キャラクターを追加</button><button id="cancelCharacterButton" class="secondary" type="button" hidden>編集をキャンセル</button><div id="characterStatus" class="status"></div></div>
<h3>キャラクター一覧</h3><div id="characterList" class="character-list"><div class="empty">まだキャラクターが登録されていません。</div></div></div>
<div class="card"><h2>✏️ 本文を作成</h2><p>普通の文章と吹き出しを好きな順番で追加できます。</p><div><button type="button" onclick="addText()">＋ 普通の文章</button><button type="button" onclick="addSpeech()">＋ 吹き出し</button></div><div id="editor" class="editor"><p id="editorEmpty" style="color:#aaa;">ここに文章や吹き出しを追加します。</p></div></div>
<div class="card"><h2>👀 プレビュー</h2><div id="preview" class="preview"><p style="color:#aaa;">ここに小説のプレビューが表示されます。</p></div></div>
</div>
<script>
const CHARACTER_KEY="yumeWorldCharacters";let characters=[];let selectedCharacterId="";let editingCharacterId=null;let pendingIcon="";let blockNumber=0;const $=id=>document.getElementById(id);
function loadCharacters(){try{characters=JSON.parse(localStorage.getItem(CHARACTER_KEY)||"[]")}catch(e){characters=[]}renderCharacters()}
function saveCharacters(){localStorage.setItem(CHARACTER_KEY,JSON.stringify(characters));renderCharacters()}
function renderCharacters(){const list=$("characterList");list.innerHTML="";if(!characters.length){list.innerHTML='<div class="empty">まだキャラクターが登録されていません。</div>';return}characters.forEach(c=>{const item=document.createElement("div");item.className="character-item"+(c.id===selectedCharacterId?" selected":"");const icon=document.createElement("img");icon.className="character-icon";icon.alt="";icon.src=c.icon||placeholderIcon();const meta=document.createElement("div");meta.className="character-meta";const name=document.createElement("strong");name.textContent=c.name;const detail=document.createElement("small");detail.textContent=(c.side==="right"?"右":"左")+"・"+c.color;meta.append(name,detail);const select=document.createElement("button");select.type="button";select.textContent=c.id===selectedCharacterId?"選択中":"選択";select.onclick=()=>{selectedCharacterId=c.id;renderCharacters()};const edit=document.createElement("button");edit.type="button";edit.className="secondary";edit.textContent="編集";edit.onclick=()=>startEditCharacter(c.id);const del=document.createElement("button");del.type="button";del.className="danger";del.textContent="削除";del.onclick=()=>deleteCharacter(c.id);item.append(icon,meta,select,edit,del);list.appendChild(item)})}
function placeholderIcon(){return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><rect width="100%" height="100%" rx="25" fill="#eadcf7"/><text x="25" y="32" text-anchor="middle" font-size="22">👤</text></svg>')}
$("characterIcon").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>pendingIcon=ev.target.result;reader.readAsDataURL(file)});
$("saveCharacterButton").onclick=()=>{const name=$("characterName").value.trim();if(!name){$("characterStatus").textContent="キャラクター名を入力してください。";return}const side=document.querySelector('input[name="characterSide"]:checked').value;const color=$("characterColor").value;if(editingCharacterId){const c=characters.find(x=>x.id===editingCharacterId);Object.assign(c,{name,side,color,icon:pendingIcon||c.icon});$("characterStatus").textContent="キャラクターを更新しました。"}else{const c={id:"character-"+Date.now(),name,side,color,icon:pendingIcon};characters.push(c);selectedCharacterId=c.id;$("characterStatus").textContent="キャラクターを保存しました。"}saveCharacters();resetCharacterForm()};
function startEditCharacter(id){const c=characters.find(x=>x.id===id);if(!c)return;editingCharacterId=id;pendingIcon="";$("characterName").value=c.name;$("characterColor").value=c.color;document.querySelector('input[name="characterSide"][value="'+c.side+'"]').checked=true;$("saveCharacterButton").textContent="キャラクターを保存";$("cancelCharacterButton").hidden=false;$("characterStatus").textContent="編集中："+c.name;window.scrollTo({top:$("characterName").getBoundingClientRect().top+window.scrollY-100,behavior:"smooth"})}
function resetCharacterForm(){$("characterName").value="";$(("characterIcon")).value="";$("characterColor").value="#f8d8e8";document.querySelector('input[name="characterSide"][value="left"]').checked=true;editingCharacterId=null;pendingIcon="";$("saveCharacterButton").textContent="＋ キャラクターを追加";$("cancelCharacterButton").hidden=true}
$("cancelCharacterButton").onclick=()=>{resetCharacterForm();$("characterStatus").textContent=""};
function deleteCharacter(id){const c=characters.find(x=>x.id===id);if(!c)return;if(!confirm("「"+c.name+"」を削除しますか？本文の吹き出しは削除されません。"))return;characters=characters.filter(x=>x.id!==id);if(selectedCharacterId===id)selectedCharacterId="";saveCharacters();$("characterStatus").textContent="キャラクターを削除しました。"}
function addText(){blockNumber++;const block=document.createElement("div");block.className="text-block";block.id="block-"+blockNumber;block.innerHTML='<label>普通の文章</label><textarea placeholder="ここに文章を入力してください"></textarea><br><button class="danger" type="button">削除</button>';block.querySelector("textarea").oninput=updatePreview;block.querySelector("button").onclick=()=>deleteBlock(block.id);$("editor").appendChild(block);updatePreview()}
function addSpeech(){blockNumber++;const c=characters.find(x=>x.id===selectedCharacterId);const block=document.createElement("div");block.className="speech-block"+(c&&c.side==="right"?" right":"");block.id="block-"+blockNumber;block.innerHTML='<div class="icon"></div><div class="speech-editor"><label>キャラクター</label><select class="speech-character"></select><label>名前</label><input class="speech-name" type="text" placeholder="キャラクター名"><label>セリフ</label><textarea class="speech-text" placeholder="セリフを入力してください"></textarea><label>吹き出しの色</label><input class="speech-color" type="color" value="#f8d8e8"><div><label class="choice"><input class="speech-side" type="checkbox"> 右側に表示</label></div><br><button class="danger" type="button">削除</button></div>';const select=block.querySelector("select");const blank=document.createElement("option");blank.value="";blank.textContent="キャラクターを選択（未登録でも入力可）";select.appendChild(blank);characters.forEach(ch=>{const option=document.createElement("option");option.value=ch.id;option.textContent=ch.name;select.appendChild(option)});select.value=c?c.id:"";block.querySelector("button").onclick=()=>deleteBlock(block.id);select.onchange=()=>applyCharacterToSpeech(block,select.value);block.querySelector(".speech-name").oninput=updatePreview;block.querySelector(".speech-text").oninput=updatePreview;block.querySelector(".speech-color").oninput=updatePreview;block.querySelector(".speech-side").onchange=()=>{block.classList.toggle("right",block.querySelector(".speech-side").checked);updatePreview()};if(c)applyCharacterToSpeech(block,c.id);else updateSpeechIcon(block,"");$("editor").appendChild(block);updatePreview()}
function applyCharacterToSpeech(block,id){const c=characters.find(x=>x.id===id);if(!c){block.querySelector(".speech-side").checked=false;block.classList.remove("right");updateSpeechIcon(block,"");return}block.querySelector(".speech-name").value=c.name;block.querySelector(".speech-color").value=c.color;block.querySelector(".speech-side").checked=c.side==="right";block.classList.toggle("right",c.side==="right");updateSpeechIcon(block,c.icon);updatePreview()}
function updateSpeechIcon(block,src){const icon=block.querySelector(".icon");icon.innerHTML="";if(src){const img=document.createElement("img");img.src=src;img.alt="";icon.appendChild(img)}else icon.textContent="👤"}
function deleteBlock(id){const block=$(id);if(block)block.remove();updatePreview()}
function updatePreview(){const preview=$("preview");preview.innerHTML="";const blocks=$("editor").children;if(!blocks.length){preview.innerHTML='<p style="color:#aaa;">ここに小説のプレビューが表示されます。</p>';return}Array.from(blocks).forEach(block=>{if(block.classList.contains("text-block")){const p=document.createElement("p");p.textContent=block.querySelector("textarea").value;p.style.lineHeight="2";preview.appendChild(p)}else if(block.classList.contains("speech-block")){const row=document.createElement("div");row.className="speech-block"+(block.classList.contains("right")?" right":"");const icon=document.createElement("div");icon.className="icon";const source=block.querySelector(".icon img");if(source){const img=document.createElement("img");img.src=source.src;img.alt="";icon.appendChild(img)}else icon.textContent="👤";const bubble=document.createElement("div");bubble.className="speech";bubble.style.background=block.querySelector(".speech-color").value;const strong=document.createElement("strong");strong.textContent=block.querySelector(".speech-name").value||"キャラクター";const br=document.createElement("br");const text=document.createTextNode(block.querySelector(".speech-text").value||"セリフ");bubble.append(strong,br,text);row.append(icon,bubble);preview.appendChild(row)}})}
loadCharacters();
</script>
</body>
</html>
