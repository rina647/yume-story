<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>小説を書く｜YUME WORLD</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: #fff8fc;
  color: #555;
}

/* ヘッダー */

header {
  background: linear-gradient(135deg, #f7c9df, #dcd0ff);
  color: white;
  padding: 25px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

.container {
  max-width: 1000px;
  margin: 30px auto;
  padding: 20px;
}

/* カード */

.card {
  background: white;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 20px;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.06);
}

h2 {
  color: #bd79a2;

  border-left:
    5px solid #dca6c7;

  padding-left: 10px;
}

/* 入力 */

input,
textarea,
select {

  width: 100%;

  padding: 12px;

  margin-top: 7px;

  border:
    1px solid #ead9e3;

  border-radius: 12px;

  background: #fffafd;

  font-size: 14px;
}

textarea {
  min-height: 100px;
}

/* ボタン */

button {

  border: none;

  padding: 11px 18px;

  margin: 5px;

  border-radius: 20px;

  cursor: pointer;

  background:
    linear-gradient(
      135deg,
      #d99bc0,
      #bca9e8
    );

  color: white;

  font-size: 14px;
}

button:hover {
  opacity: 0.85;
}

/* エディター */

.editor {

  background: #faf7ff;

  padding: 20px;

  border-radius: 15px;

  min-height: 200px;
}

/* 本文 */

.text-block {

  background: white;

  padding: 15px;

  margin: 12px 0;

  border-radius: 12px;

  border:
    1px solid #ead9e3;
}

/* 吹き出し */

.speech-block {

  display: flex;

  gap: 10px;

  align-items: flex-start;

  margin: 15px 0;
}

.icon {

  width: 50px;

  height: 50px;

  border-radius: 50%;

  background: #eadcf7;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.speech {

  padding: 13px 18px;

  border-radius: 20px;

  background: #f8d8e8;

  max-width: 75%;

  word-break: break-word;
}

/* 削除 */

.delete {

  background: #ddd;

  color: #666;

  font-size: 12px;

}

/* プレビュー */

.preview {

  background: #fff;

  padding: 20px;

  border-radius: 15px;

  min-height: 200px;

  border:
    1px solid #eee;
}

</style>

</head>

<body>

<header>

<h1>✏️ 小説を書く</h1>

<p>YUME WORLD</p>

</header>


<div class="container">


<div class="card">

<h2>📖 小説情報</h2>

<label>
小説タイトル
</label>

<input
id="title"
type="text"
placeholder="小説のタイトル"
>


<label>
あらすじ
</label>

<textarea
placeholder="小説のあらすじ"
></textarea>

</div>



<div class="card">

<h2>📚 チャプター</h2>

<label>
チャプタータイトル
</label>

<input
id="chapterTitle"
type="text"
placeholder="第1話「はじまり」"
>

</div>



<div class="card">

<h2>✏️ 本文を作成</h2>

<p>
好きな順番で文章や吹き出しを追加できます。
</p>


<div>

<button onclick="addText()">
＋ 普通の文章
</button>

<button onclick="addSpeech()">
＋ 吹き出し
</button>

</div>


<div
id="editor"
class="editor"
>

<p style="color:#aaa;">
ここに文章や吹き出しを追加します。
</p>

</div>

</div>



<div class="card">

<h2>👀 プレビュー</h2>

<div
id="preview"
class="preview"
>

<p style="color:#aaa;">
ここに小説のプレビューが表示されます。
</p>

</div>

</div>


</div>



<script>

/* ブロック番号 */

let blockNumber = 0;


/* 普通の文章 */

function addText() {

blockNumber++;

const editor =
document.getElementById("editor");


const block =
document.createElement("div");


block.className =
"text-block";


block.id =
"block-" + blockNumber;


block.innerHTML = `

<label>
普通の文章
</label>

<textarea
placeholder="ここに文章を入力してください"
oninput="updatePreview()"
></textarea>

<br>

<button
class="delete"
onclick="deleteBlock('${block.id}')"
>
削除
</button>

`;

editor.appendChild(block);

updatePreview();

}


/* 吹き出し */
function addSpeech() {

blockNumber++;

const editor =
document.getElementById("editor");

const block =
document.createElement("div");

block.className =
"speech-block";

block.id =
"block-" + blockNumber;

block.innerHTML = `

<div class="icon">
👤
</div>

<div style="flex:1;">

<label>
キャラクター名
</label>

<input
type="text"
placeholder="キャラクター名"
oninput="updatePreview()"
>

<label>
アイコン画像
</label>

<input
type="file"
accept="image/*"
onchange="loadIcon(this, '${block.id}')"
>

<label>
☑ この画像を使用する権利があります
</label>

<label>
☑ 著作権・肖像権などを侵害していないことを確認しました
</label>

<label>
セリフ
</label>

<textarea
placeholder="セリフを入力してください"
oninput="updatePreview()"
></textarea>

<label>
吹き出しの色
</label>

<input
type="color"
value="#f8d8e8"
oninput="updatePreview()"
>

<br>

<button
class="delete"
onclick="deleteBlock('${block.id}')"
>
削除
</button>

</div>

`;

editor.appendChild(block);

updatePreview();

}
function loadIcon(input, blockId) {

const file =
input.files[0];

if (!file) return;

const reader =
new FileReader();

reader.onload =
function(e) {

const block =
document.getElementById(blockId);

block.dataset.icon =
e.target.result;

const icon =
block.querySelector(".icon");

icon.innerHTML =
`<img src="${e.target.result}"
style="width:50px;height:50px;border-radius:50%;object-fit:cover;">`;

updatePreview();

};

reader.readAsDataURL(file);

}
function deleteBlock(id) {

const block =
document.getElementById(id);

if(block) {

block.remove();

}

updatePreview();

}


/* プレビュー更新 */

function updatePreview() {

const editor =
document.getElementById("editor");

const preview =
document.getElementById("preview");


preview.innerHTML = "";


const blocks =
editor.children;


for(let block of blocks) {


/* 普通の文章 */

if(
block.classList.contains(
"text-block"
)
) {

const textarea =
block.querySelector(
"textarea"
);


const p =
document.createElement("p");


p.textContent =
textarea.value;


p.style.lineHeight =
"2";


preview.appendChild(p);

}


/* 吹き出し */

if(
block.classList.contains(
"speech-block"
)
) {


const inputs =
block.querySelectorAll(
"input"
);


const textarea =
block.querySelector(
"textarea"
);


const name =
inputs[0].value;

const color = 
inputs[2].value;

  


const bubble =
document.createElement("div");


bubble.className =
"speech-block";


bubble.innerHTML = `

<div class="icon">
👤
</div>

<div
class="speech"
style="background:${color};"
>

<strong>
${name || "キャラクター"}
</strong>

<br>

${textarea.value || "セリフ"}

</div>

`;


preview.appendChild(
bubble
);

}

}

}

</script>

</body>
</html>
