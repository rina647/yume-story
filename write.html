<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小説を書く｜YUME WORLD</title>
<style>
:root{--pink:#d99bc0;--lav:#bca9e8;--text:#625665;--line:#ead9e3}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:"Yu Gothic",sans-serif;background-color:#fff9fc;background-image:url('yume-world-write-vertical-b.png');background-position:center top;background-size:cover;background-repeat:no-repeat;background-attachment:fixed;min-height:100vh}header{background:linear-gradient(135deg,#f7c9df,#dcd0ff);color:#fff;padding:30px 20px;text-align:center;position:relative}header h1{margin:0;font-size:1.65rem}header p{margin:7px 0 0}.home{position:absolute;left:18px;top:18px;color:#fff;text-decoration:none;background:#ffffff45;border:1px solid #fff8;padding:9px 14px;border-radius:20px}.page{max-width:760px;margin:25px auto;padding:0 16px}.card{background:#fffffff2;border:1px solid #fff;border-radius:24px;box-shadow:0 8px 26px #b888b51c;padding:25px}h2{margin:0 0 20px;color:#aa7298;font-size:1.2rem}label{display:block;margin:18px 0 7px;color:#8d6c86;font-weight:700}input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;background:#fffafd;padding:12px 13px;color:var(--text);font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 3px #d99bc026}textarea{min-height:180px;resize:vertical}.hint{font-size:.82rem;color:#9b8998;margin:6px 0}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tag{background:#f8e4ef;color:#a26c91;border-radius:18px;padding:6px 10px;font-size:.9rem}.tag button{border:0;background:transparent;color:#a26c91;cursor:pointer;font-size:1rem;padding:0 0 0 4px}.tag-row{display:flex;gap:8px}.tag-row input{flex:1}.btn{border:0;border-radius:22px;padding:11px 17px;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font:inherit;font-weight:700}.btn.secondary{background:#eee4f5;color:#85678d}.btn.danger{background:#f3dfe8;color:#a36b86}.choice{display:flex;gap:20px;flex-wrap:wrap}.choice label{margin:0;font-weight:400;display:flex;align-items:center;gap:7px}.choice input{accent-color:var(--pink)}.cover-area{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.cover-preview{width:180px;height:235px;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--lav));overflow:hidden;flex:none}.cover-preview img{width:100%;height:100%;object-fit:cover}.cover-actions{flex:1;min-width:210px}.save-area{text-align:center;margin-top:26px;padding-top:20px;border-top:1px solid #f0e2ea}.save{font-size:1.1rem;padding:13px 32px}.status{min-height:24px;color:#a26c91;margin-top:10px}.small-note{font-size:.78rem;color:#a18c9d}@media(max-width:600px){header{padding:58px 15px 24px}.home{top:14px;left:12px}.page{padding:0 10px;margin-top:15px}.card{padding:18px;border-radius:19px}.cover-preview{width:145px;height:190px}.cover-actions{min-width:0}.tag-row{display:block}.tag-row button{margin-top:8px;width:100%}}

.lumi-page-art{max-width:1000px;margin:14px auto 0;padding:0 16px;position:relative;z-index:0}.lumi-page-art__inner{position:relative;min-height:118px;overflow:hidden;border:1px solid #eadcf3;border-radius:24px;background:linear-gradient(105deg,#f4f2ff,#fff7fb 58%,#f0f8ff);box-shadow:0 8px 25px #ae86ae18}.lumi-page-art img{position:absolute;right:0;top:-18px;width:54%;height:160px;object-fit:cover;object-position:center 40%;mix-blend-mode:multiply;opacity:.92}.lumi-page-art__copy{position:relative;z-index:1;width:52%;padding:29px 25px;color:#98749a;font-size:clamp(15px,2vw,21px);font-weight:700;letter-spacing:.04em}.lumi-page-art__copy::before{content:'✦';display:block;margin-bottom:4px;color:#dba5c5;font-size:16px}.lumi-page-art--reader .lumi-page-art__inner{background:linear-gradient(105deg,#f2f6ff,#fffafe)}.lumi-page-art--write .lumi-page-art__inner{background:linear-gradient(105deg,#fff7fc,#f0f6ff)}@media(max-width:650px){.lumi-page-art{padding:0 10px;margin-top:10px}.lumi-page-art__inner{min-height:95px;border-radius:18px}.lumi-page-art img{top:-5px;width:58%;height:110px;opacity:.78}.lumi-page-art__copy{width:58%;padding:22px 15px;font-size:14px}.lumi-page-art__copy::before{font-size:13px}}
</style>
</head>
<body><section class="lumi-page-art lumi-page-art--write" aria-label="ルミの案内"><div class="lumi-page-art__inner"><img src="lumi-write.png" alt="ルミ：今日はどんな物語を書く？"><div class="lumi-page-art__copy">今日はどんな物語を書く？</div></div></section>
<header><a class="home" href="index.html">← ホーム</a><h1>✏️ 小説を書く</h1><p>YUME WORLD</p></header>
<main class="page"><section class="card">
<h2>📖 小説情報</h2>
<label for="title">タイトル</label><input id="title" type="text" placeholder="小説タイトルを入力">
<label for="summary">あらすじ</label><textarea id="summary" placeholder="小説の内容を入力してください"></textarea>
<label for="catchCopy">キャッチコピー</label><input id="catchCopy" type="text" placeholder="小説の魅力を短く紹介">
<label for="genre">ジャンル</label><select id="genre"><option>恋愛</option><option>青春</option><option>学園</option><option>ファンタジー</option><option>ミステリー</option><option>ホラー</option><option>冒険</option><option>コメディ</option><option>その他</option></select>
<label>ハッシュタグ <span class="small-note">（最大20個）</span></label><div class="tag-row"><input id="tagInput" type="text" placeholder="#夢小説 または 夢小説"><button id="addTag" class="btn" type="button">タグを追加</button></div><div id="tags" class="tags"></div><p id="tagStatus" class="status"></p>
<label for="rating">セルフレイティング</label><select id="rating"><option value="全年齢">全年齢</option><option value="R15">R15</option><option value="R18">R18</option></select><p class="hint">年齢制限の実際の閲覧制御は将来の認証機能追加に対応できる形式で保存します。</p>
<label>オリジナル小説</label><div class="choice"><label><input id="original" type="checkbox"> オリジナル小説として表示する</label></div>
<label for="visibility">公開範囲</label><select id="visibility"><option value="public">全体に公開</option><option value="limited">限定公開</option><option value="private">非公開</option></select><p id="visibilityHint" class="hint"></p>
<label>表紙</label><div class="cover-area"><div id="coverPreview" class="cover-preview">YUME<br>WORLD</div><div class="cover-actions"><input id="coverInput" type="file" accept="image/*"><p class="hint">画像を設定しない場合はYUME WORLDのデフォルトデザインを表示します。</p><button id="removeCover" class="btn danger" type="button">表紙を削除</button></div></div>
<div class="save-area"><button id="save" class="btn save" type="button">小説を保存する</button><p id="status" class="status" aria-live="polite"></p></div>
</section></main>
<script>
const BASE='yumeWorldNovelV3',active=localStorage.getItem('yumeWorldActiveAccount')||'guest',KEY=active==='guest'?BASE:BASE+':'+active,$=id=>document.getElementById(id);let data={title:'',summary:'',cover:'',novelInfo:{genre:'恋愛',catchCopy:'',hashtags:[],selfRating:'全年齢',original:false},visibility:'private'};let tags=[];
function read(){try{const old=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(BASE)||'null');if(old){data=Object.assign(data,old);data.novelInfo=Object.assign({genre:'恋愛',catchCopy:'',hashtags:[],selfRating:'全年齢',original:false},old.novelInfo||{});tags=[...data.novelInfo.hashtags]}}catch(e){}}
function esc(x){const d=document.createElement('div');d.textContent=x||'';return d.innerHTML}function imageRead(file){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(file)})}
function renderTags(){ $('tags').innerHTML=tags.map((t,i)=>`<span class="tag">#${esc(t)} <button type="button" data-i="${i}" aria-label="${esc(t)}を削除">×</button></span>`).join('');$('tags').querySelectorAll('button').forEach(b=>b.onclick=()=>{tags.splice(+b.dataset.i,1);renderTags()})}
function renderCover(){const p=$('coverPreview');p.innerHTML=data.cover?`<img src="${data.cover}" alt="表紙プレビュー">`:'YUME<br>WORLD'}
function load(){read();$('title').value=data.title||'';$('summary').value=data.summary||'';$('catchCopy').value=data.novelInfo.catchCopy||'';$('genre').value=data.novelInfo.genre||'恋愛';$('rating').value=data.novelInfo.selfRating||'全年齢';$('original').checked=!!data.novelInfo.original;$('visibility').value=data.visibility||'private';renderTags();renderCover();updateHint()}
function updateHint(){$('visibilityHint').textContent=$('visibility').value==='limited'?'限定公開の詳細な共有制御は将来追加できます。':$('visibility').value==='private'?'本人のみ閲覧できる保存状態です。':''}
$('addTag').onclick=()=>{const value=$('tagInput').value.trim().replace(/^#+/,'');if(!value)return;if(tags.length>=20){$('tagStatus').textContent='ハッシュタグは最大20個までです。';return}if(!tags.includes(value))tags.push(value);$('tagInput').value='';$('tagStatus').textContent='';renderTags()};$('tagInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('addTag').click()}};$('visibility').onchange=updateHint;$('coverInput').onchange=async e=>{if(e.target.files[0]){data.cover=await imageRead(e.target.files[0]);renderCover()}};$('removeCover').onclick=()=>{data.cover='';$('coverInput').value='';renderCover()};$('save').onclick=()=>{data.title=$('title').value.trim();data.summary=$('summary').value;data.novelInfo.genre=$('genre').value;data.novelInfo.catchCopy=$('catchCopy').value;data.novelInfo.hashtags=[...tags];data.novelInfo.selfRating=$('rating').value;data.novelInfo.original=$('original').checked;data.visibility=$('visibility').value;localStorage.setItem(KEY,JSON.stringify(data));$('status').textContent='保存しました。ページを更新しても内容は保持されます。';setTimeout(()=>$('status').textContent='',3000)};load();
</script>
</body></html>
